name: altrobytelab
description: AltrobyteLab - AI-Powered Coaching Management Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.65.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  go_router: ^12.1.1
  data_table_2: ^2.5.12
  dropdown_search: ^5.0.6
  flutter_slidable: ^3.0.1
  percent_indicator: ^4.2.3
  timeline_tile: ^2.0.0
  uuid: ^4.2.1
  csv: ^6.0.0
  url_launcher: ^6.2.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  share_plus: ^7.2.2
  spreadsheet_decoder: ^2.3.0
  mqtt_client: ^10.2.1
  web_socket_channel: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.13

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a237e"
  adaptive_icon_foreground: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"

flutter_native_splash:
  color: "#1a237e"
  image: assets/logo.png
  android: true
  ios: false
  web: true
  android_12:
    image: assets/logo.png
    color: "#1a237e"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
