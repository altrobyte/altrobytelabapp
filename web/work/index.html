<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student work · Altrobyte Lab</title>
<meta name="description" content="Embedded systems and IoT projects built by learners at Altrobyte Lab, Indore: ESP32, STM32, MQTT, IIoT and more.">
<link rel="canonical" href="https://altrobytelab.com/work">
<link rel="icon" href="/icons/Icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0A1220; --panel:#13223A; --line:#22344F; --text:#E8EEF6; --soft:#9DB0C6; --orange:#FF6A1A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
  nav { position: sticky; top: 0; z-index: 5; background: rgba(10,18,32,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .logo { display: flex; gap: 8px; align-items: center; font: 700 17px "Space Grotesk"; white-space: nowrap; } .logo img { width: 28px; height: 28px; border-radius: 7px; }
  .btn { display: inline-block; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .btn-main { background: var(--orange); color: #fff; } .btn-ghost { border: 1px solid var(--line); }
  h1 { font: 700 clamp(28px, 6vw, 42px)/1.15 "Space Grotesk"; margin: 34px 0 8px; }
  .lead { color: var(--soft); margin: 0 0 22px; }
  .card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 0 0 14px; }
  .card:hover { border-color: #33507A; }
  .k { font-size: 12.5px; color: var(--orange); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .card h2 { font: 700 20px "Space Grotesk"; margin: 4px 0 6px; }
  .meta { color: var(--soft); font-size: 13.5px; }
  .post { font-size: 17px; margin: 16px 0; }
  .quote { border-left: 3px solid var(--orange); padding: 2px 0 2px 14px; color: var(--soft); margin: 16px 0; }
  .cta { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 28px 0 40px; }
  .muted { color: var(--soft); }
  form label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  form input, form select, form textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0F1B2E; color: var(--text); font: 15px Inter, sans-serif; }
  form .chk { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
  form .chk input { width: 18px; height: 18px; flex: none; margin-top: 3px; }
  button.btn { border: 0; cursor: pointer; font: 600 15px Inter, sans-serif; padding: 12px 22px; margin-top: 18px; }
</style>
</head>
<body>
<nav><div class="wrap"><a class="logo" href="/"><img src="/icons/Icon-192.png" alt="">Altrobyte Lab</a><a class="btn btn-main" href="/learn">Start learning free</a></div></nav>
<main class="wrap" id="app"><h1>Student work</h1><p class="lead">Loading…</p></main>
<script>
(function () {
  // Student work in public (18 Nov 2026, founder): what learners built, published by their mentor; by name only when
  // the learner agreed. /work lists it; /work/<slug> is one post.
  var API = 'https://edu.altrobytelab.com', app = document.getElementById('app');
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function day(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : ''; }
  var cta = '<div class="cta"><b>Build your own at Altrobyte Lab</b><p class="muted" style="margin:4px 0 12px;font-size:14.5px">Embedded systems and IoT, from your first ESP32 to industrial products: live classes in Indore and online, or with Altron, our AI teacher.</p><a class="btn btn-main" href="/learn">Start free</a> <a class="btn btn-ghost" href="/pricing">See plans</a></div>';
  // The shareable form (18 Nov 2026, founder: "a link to share; they fill it and submit").
  if (/^\/work\/submit\/?$/.test(location.pathname)) {
    document.title = 'Submit your assignment · Altrobyte Lab';
    // Only signed-in learners submit (18 Nov 2026, founder); their name and number come from the sign-in.
    var tok = ''; try { tok = JSON.parse(localStorage.getItem('flutter.student_token') || '""') || ''; } catch (x) {}
    if (!tok) {
      app.innerHTML = '<h1>Submit your assignment</h1><p class="lead">Sign in with your WhatsApp number first, then come back to this page.</p>' +
        '<a class="btn btn-main" href="/signin?next=' + encodeURIComponent('/work/submit') + '">Sign in with WhatsApp</a>';
      return;
    }
    app.innerHTML = '<h1>Submit your assignment</h1><p class="lead">Your mentor reviews it. With your permission, it goes on altrobytelab.com/work: a public page to share on LinkedIn.</p>' +
      '<form id="f"><label>Assignment</label><select name="title" required><option value="">Loading the assignments…</option></select>' +
      '<input name="other" maxlength="200" placeholder="Name of the assignment" style="display:none;margin-top:8px">' +
      '<label>Mentor</label><input name="mentor" maxlength="80" value="Pawan Meena">' +
      '<label>Link to your work</label><input name="link" required type="url" placeholder="https://github.com/you/project">' +
      '<label>What did you learn? (2-3 lines)</label><textarea name="learned" rows="3" maxlength="1000"></textarea>' +
      '<label class="chk"><input type="checkbox" name="consent"> Show my work with my name on altrobytelab.com/work</label>' +
      '<button class="btn btn-main" type="submit">Submit</button><p class="muted" id="msg" style="margin-top:10px"></p></form>';
    var f = document.getElementById('f'), E = f.elements, sel = E.title;
    fetch(API + '/learn/roadmap').then(function (r) { return r.json(); }).then(function (d) {
      var opts = '<option value="">Choose…</option>';
      (d.modules || []).forEach(function (m) { (m.items || []).forEach(function (it) { if (it.type === 'assignment') opts += '<option>' + esc(String(it.title).replace(/^Assignment:\s*/, '')) + '</option>'; }); });
      sel.innerHTML = opts + '<option value="__other">Other</option>';
    }).catch(function () { sel.innerHTML = '<option value="__other">Other</option>'; E.other.style.display = 'block'; });
    sel.onchange = function () { E.other.style.display = sel.value === '__other' ? 'block' : 'none'; };
    f.onsubmit = function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg'), b = f.querySelector('button');
      var title = sel.value === '__other' ? E.other.value.trim() : sel.value;
      if (!title) { msg.textContent = 'Choose the assignment.'; return; }
      b.disabled = true; b.textContent = 'Sending…';
      fetch(API + '/work/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify({
        name: '', title: title, mentor: E.mentor.value.trim(), link: E.link.value.trim(),
        learned: E.learned.value.trim(), consent: E.consent.checked }) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw Object.assign(j, { status: r.status }); return j; }); })
        .then(function () { app.innerHTML = '<h1>Submitted ✓</h1><p class="lead">Thank you! Your mentor will review your work. Once it is published, you will find it on <a href="/work" style="color:var(--orange)">altrobytelab.com/work</a>.</p>' + cta; })
        .catch(function (j) { if (j && j.status === 401) { location.href = '/signin?next=' + encodeURIComponent('/work/submit'); return; } b.disabled = false; b.textContent = 'Submit'; msg.textContent = (j && typeof j.detail === 'string') ? j.detail : 'Could not send just now. Please try again in a minute.'; });
    };
    return;
  }
  var slug = (location.pathname.match(/^\/work\/([a-z0-9-]+)\/?$/) || [])[1];
  function fail() { app.innerHTML = '<h1>Student work</h1><p class="lead">Could not load this just now. Please try again.</p><a class="btn btn-ghost" href="/work">All student work</a>'; }
  if (slug) {
    fetch(API + '/work/' + slug).then(function (r) { if (!r.ok) throw r; return r.json(); }).then(function (w) {
      var title = w.name + ': ' + w.title;
      document.title = title + ' · Altrobyte Lab';
      var md = document.querySelector('meta[name=description]'); md.content = String(w.summary).slice(0, 155);
      document.querySelector('link[rel=canonical]').href = 'https://altrobytelab.com/work/' + w.slug;
      var ld = document.createElement('script'); ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BlogPosting', headline: title, datePublished: w.date,
        author: { '@type': 'Person', name: w.name }, publisher: { '@type': 'Organization', name: 'Altrobyte Lab', url: 'https://altrobytelab.com' }, description: w.summary });
      document.head.appendChild(ld);
      app.innerHTML = '<p style="margin:24px 0 0"><a class="muted" href="/work">← All student work</a></p><div class="k" style="margin-top:14px">Assignment</div><h1 style="margin-top:4px">' + esc(w.title) + '</h1>' +
        '<div class="meta">' + esc(w.name) + (w.mentor ? ' · mentor ' + esc(w.mentor) : '') + (w.date ? ' · ' + day(w.date) : '') + '</div>' +
        '<p class="post">' + esc(w.summary) + '</p>' + (w.learned ? '<div class="quote">“' + esc(w.learned) + '”</div>' : '') +
        (w.link ? '<a class="btn btn-ghost" href="' + esc(w.link) + '" target="_blank" rel="noopener">See the work →</a>' : '') + cta;
    }).catch(function (r) { if (r && r.status === 404) { app.innerHTML = '<h1>Not found</h1><p class="lead">This work is not public.</p><a class="btn btn-ghost" href="/work">All student work</a>'; } else fail(); });
  } else {
    fetch(API + '/work').then(function (r) { return r.json(); }).then(function (d) {
      var ws = d.work || [];
      app.innerHTML = '<h1>Student work</h1><p class="lead">Projects and assignments built by our learners, reviewed by their mentors.</p>' +
        (ws.length ? ws.map(function (w) {
          return '<a class="card" href="/work/' + esc(w.slug) + '"><div class="k">' + esc(w.name) + (w.date ? ' · ' + day(w.date) : '') + '</div><h2>' + esc(w.title) + '</h2>' +
            '<div class="muted" style="font-size:15px">' + esc(String(w.summary).slice(0, 220)) + (String(w.summary).length > 220 ? '…' : '') + '</div></a>';
        }).join('') : '<p class="muted">The first works are being reviewed.</p>') + cta;
    }).catch(fail);
  }
})();
</script>
</body>
</html>
