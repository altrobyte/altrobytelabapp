<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning · Altrobyte Lab</title>
<meta name="description" content="The Altrobyte learning platform: notes, videos, code, tests and projects, step by step, with live classes and their recordings.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://edu.altrobytelab.com" crossorigin>
<!-- The learning platform on the web (31 Oct 2026, founder: the roadmap is the syllabus, shared as a page and a PDF;
     "Start learning" opens the learning platform, kept separate, with a full-screen mode on the web).
       /learn            the course: levels and steps; every step brings its notes, videos, code, tests and projects
       /learn/<m>/<c>    one item of a step (the course stays beside it on a wide screen)
       /learn/live       live classes: the next ones and the recordings (recordings open for programme learners)
     Plain HTML, so it opens at once on a phone (the Flutter pages took 15-20 s). Sign-in is the app's /signin (same
     browser storage). The server decides what is open: four lessons free with an account, the rest with a plan. -->
<style>
  :root { --ink:#0A1220; --ink2:#0F1B2E; --panel:#13223A; --panel2:#182A45; --line:#22344F; --text:#E8EEF6; --soft:#9DB0C6; --orange:#FF6A1A;
          --green:#2BD47D; --gold:#D9A441; --cyan:#38E1D3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 0; cursor: pointer; white-space: nowrap; }
  .btn-main { background: var(--orange); color: #fff; }
  .btn-ghost { border: 1px solid var(--line); background: transparent; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  .muted { color: var(--soft); }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 16px; background: var(--ink2); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; white-space: nowrap; }
  .logo img { width: 26px; height: 26px; border-radius: 7px; }
  .tabs { display: flex; gap: 4px; margin-left: 10px; }
  .tabs a { padding: 7px 12px; border-radius: 8px; color: var(--soft); font-weight: 600; font-size: 14px; }
  .tabs a.on { background: var(--panel); color: #fff; }
  .bar .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .acct { position: relative; }
  .acct summary { list-style: none; cursor: pointer; }
  .acct summary::-webkit-details-marker { display: none; }
  .acct .menu { position: absolute; right: 0; top: 42px; z-index: 50; min-width: 220px; background: var(--panel); border: 1px solid var(--line, rgba(255,255,255,.12)); border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .acct .menu a { display: block; padding: 10px 12px; border-radius: 8px; color: inherit; text-decoration: none; font-size: 14px; }
  .acct .menu a:hover { background: var(--panel2); }
  .acct .menu hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 4px 0; }
  .me { width: 32px; height: 32px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-weight: 700; color: var(--orange); }
  @media (max-width: 640px) { .logo span { display: none; } .tabs { margin-left: 0; } }

  /* course layout: outline + content */
  .shell { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
  .side { overflow-y: auto; border-right: 1px solid var(--line); background: var(--ink2); padding: 14px 10px 40px; }
  .main { overflow-y: auto; min-width: 0; }
  /* Reading: the lesson gets the whole width; the course list opens with the ☰ button (31 Oct 2026, founder). */
  @media (min-width: 901px) { .shell.reading { grid-template-columns: 1fr; } .shell.reading .side { display: none; }
    .shell.reading.outline-on { grid-template-columns: 300px 1fr; } .shell.reading.outline-on .side { display: block; } }
  .side, .main, .body { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  @media (max-width: 900px) { .shell { display: flex; flex-direction: column-reverse; height: auto; } .side { border: 0; background: none; padding: 0 12px 40px; } .shell.reading { height: calc(100dvh - 56px); } .shell.reading .side { display: none; } .shell.reading .main { flex: 1; } }
  .lvl { margin: 12px 6px 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .step { border-radius: 10px; margin-bottom: 4px; }
  .step > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 10px; }
  .step > button:hover { background: var(--panel); }
  .step .no { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--panel2); color: var(--soft); flex: none; }
  .step.done .no { background: var(--green); color: #052; }
  .step .t { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }
  .step .t small { display: block; font-weight: 400; color: var(--soft); font-size: 12px; }
  .step .chev { color: var(--soft); transition: transform .15s; }
  .step.x .chev { transform: rotate(90deg); }
  .items { display: none; padding: 0 0 6px 34px; }
  .step.x .items { display: block; }
  .it { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; color: #cfd9e6; cursor: pointer; }
  .it:hover { background: var(--panel); }
  .it.on { background: var(--panel2); color: #fff; }
  .it .ic { width: 18px; text-align: center; flex: none; opacity: .9; }
  .it .nm { flex: 1; min-width: 0; }
  .it.lk { opacity: .5; }
  .it .ok { color: var(--green); font-size: 12px; flex: none; }
  .tag { flex: none; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(43,212,125,.14); color: var(--green); }
  .tag.live { background: rgba(217,164,65,.15); color: var(--gold); }

  /* welcome / panels */
  .pad { padding: 28px 28px 30px; max-width: 860px; }
  @media (max-width: 900px) { .pad { padding: 18px 14px 20px; } }
  h1 { font-size: 22px; line-height: 1.25; }
  h2 { font-size: 17px; margin: 26px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .prog { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0 4px; }
  .prog i { display: block; height: 100%; background: var(--green); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .cls { display: flex; flex-direction: column; gap: 6px; }
  .cls img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--panel2); }
  .cls b { font-size: 15px; line-height: 1.3; }
  .skel { height: 46px; border-radius: 10px; margin: 6px; background: linear-gradient(90deg, var(--panel), var(--panel2), var(--panel)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* an item */
  .lv { display: flex; flex-direction: column; height: 100%; }
  .lv .top { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--ink2); flex: none; }
  .lv .top .tt { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv .top .tt small { display: block; font-weight: 400; color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: none; cursor: pointer; display: grid; place-items: center; flex: none; }
  .lv:fullscreen { background: var(--ink); }
  .lv iframe.note { flex: 1; width: 100%; border: 0; background: #fff; }
  .lv .body { flex: 1; overflow-y: auto; }
  .video { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
  pre.code { background: #0B1424; border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; font: 13px/1.5 "Spline Sans Mono", Consolas, monospace; color: #DDE6F2; white-space: pre; }
  .foot { flex: none; display: flex; gap: 10px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--ink2); }
  .foot .muted { flex: 1; font-size: 13px; }
  .strip { flex: none; height: 64px; display: flex; border-top: 1px solid var(--line); }
  .strip iframe { flex: 1; border: 0; }
  @media (max-width: 900px) { .hide-s { display: none; } }

  /* in the Android app the app has its own tabs and sign-in */
  .inapp .bar { display: none; }
  .inapp .shell, .inapp .shell.reading { height: 100vh; height: 100dvh; }
  .aipick { position: fixed; z-index: 50; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; width: 270px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .card.desk { margin: 12px 0 16px; }
  .golive { position: fixed; right: 18px; bottom: 84px; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #FF6A1A, #FF9A3D); color: #fff; font: 700 14.5px Inter, system-ui, sans-serif; box-shadow: 0 12px 30px -8px rgba(255,106,26,.75); }
  .golive i { font-style: normal; font-size: 18px; } .golive small { display: block; font-weight: 500; font-size: 11.5px; opacity: .9; text-align: left; }
  .golive:hover { transform: translateY(-2px); }
  @media (max-width: 600px) { .golive { right: 12px; bottom: 78px; padding: 10px 14px; font-size: 13.5px; } .golive small { display: none; } }
  .livepanel { position: fixed; right: 18px; bottom: 150px; z-index: 41; width: min(380px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow-y: auto; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 10px; }
  @media (max-width: 600px) { .livepanel { right: 12px; bottom: 132px; } }
  .livepanel .lb { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .livepanel .lb b { font-size: 14px; display: block; } .livepanel .lb span { font-size: 12.5px; color: var(--soft); }
  .livepanel .lpcall { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .livepanel .lpcall input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink2); color: inherit; font: inherit; font-size: 14px; }
  .livepanel .fr { color: #38E1D3; font-weight: 800; font-size: 11px; letter-spacing: .08em; }
  .sum { flex: none; border-bottom: 1px solid var(--line); background: var(--ink2); padding: 8px 14px; font-size: 14px; }
  .sum summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; } .sum summary::-webkit-details-marker { display: none; }
  .sum summary::before { content: '▸'; color: var(--orange2, #FF9A3D); } .sum[open] summary::before { content: '▾'; }
  .sum summary span { color: var(--soft); font-size: 13px; } .sum ol { margin: 8px 0 4px 20px; columns: 2; column-gap: 28px; color: var(--soft); }
  @media (max-width: 700px) { .sum ol { columns: 1; } }
  .side .subt { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #8a9bb3; padding: 10px 12px 4px; }
  /* /learn opens on the roadmap itself, full width (6 Nov 2026, founder: "the roadmap is what we sell, first view"). */
  .rm { max-width: 1180px; margin: 0 auto; padding: 22px 20px 120px; }
  @media (max-width: 600px) { .rm { padding: 16px 16px 120px; } }
  .rm-hero { display: flex; gap: 18px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .rm-hero .k { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--orange); }
  .rm-hero h1 { font-size: clamp(22px, 3.2vw, 32px); margin-top: 4px; }
  .rm-hero .st { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .rm-hero .st span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: #cfd9e6; }
  .rm-hero .st b { color: #fff; }
  .rm-go { display: grid; gap: 6px; min-width: 0; max-width: 100%; }
  .rm-go .btn { white-space: normal; text-align: left; }
  .rm-go .prog { margin: 0; }
  .stage { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 0 14px; padding-top: 26px; }
  .stage::before { content: ''; position: absolute; left: 21px; top: 70px; bottom: -26px; width: 2px; background: var(--line); }
  .stage:last-of-type::before { display: none; }
  .stage .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #0A1220; position: relative; z-index: 1; }
  .stage .hd { min-height: 44px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .stage .hd h2 { margin: 0; font-size: 19px; line-height: 1.25; }
  .stage .hd p { color: var(--soft); font-size: 13.5px; margin-top: 2px; }
  .topics { grid-column: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 12px; align-items: start; }
  @media (max-width: 600px) { .stage { grid-template-columns: 34px 1fr; gap: 0 10px; } .stage .dot { width: 34px; height: 34px; font-size: 14px; } .stage::before { display: none; }
    .topics { grid-column: 1 / -1; grid-template-columns: 1fr; } }
  .tp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
  .tp.x { grid-column: 1 / -1; }
  .tp > button { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 14px; display: grid; gap: 6px; }
  .tp > button:hover { background: var(--panel2); }
  .tp > button:disabled { cursor: default; background: none; }
  .tp .tt2 { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; font-size: 15px; line-height: 1.3; }
  .tp .tt2 .chev { margin-left: auto; color: var(--soft); transition: transform .15s; }
  .tp.x .tt2 .chev { transform: rotate(90deg); }
  .tp .cn { font-size: 12.5px; color: var(--soft); }
  .tp .pv { font-size: 13px; color: #b8c6d8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tp .mini { height: 4px; border-radius: 9px; background: rgba(255,255,255,.07); overflow: hidden; }
  .tp .mini i { display: block; height: 100%; background: var(--green); }
  .tp .items { padding: 4px 8px 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 12px; border-top: 1px solid var(--line); }
  .tp.x .items { display: grid; }
  .tp .items .subt { grid-column: 1 / -1; padding: 10px 10px 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #8a9bb3; }
  .rm-foot { margin-top: 36px; font-size: 13px; color: var(--soft); }
  .rm-foot a { text-decoration: underline; }
</style>

<script>
(function () {
  var API = 'https://edu.altrobytelab.com';
  var root = document.getElementById('root');

  // The course, step by step (same order as the syllabus). A step lists its lessons as [module, lesson]; whatever
  // follows a lesson in its module (code, a test, a project, a video) comes with it. A step without lessons is taught
  // live in the programme.
  var LEVELS = [
    ['Beginner', '#2BD47D', [
      ['Electronics basics', [[5, 21], [5, 22], [4, 19]]],
      ['Microcontrollers', [[5, 23], [5, 95], [5, 25], [5, 26]]],
      ['Digital input and output', [[5, 92], [5, 96], [5, 31], [5, 32]]],
      ['Git and GitHub for firmware', [[10, 61]]]]],
    ['Basic', '#5B9BFF', [
      ['Embedded C', [[5, 34]]],
      ['ADC, DAC and PWM', [[5, 36], [5, 37]]],
      ['ESP32, STM32 and Raspberry Pi', [[5, 67], [5, 68], [5, 71], [8, 87], [5, 70]]],
      // ESP-IDF right after the boards (1 Nov 2026, founder: the class starts it now; it sat at step 13 in Advance).
      // One topic per lesson: the ESP-IDF series 1-6 (lessons 105-110), then the older overview.
      ['ESP-IDF', [[5, 105], [5, 106], [5, 107], [5, 108], [5, 109], [5, 110], [5, 41]]],
      ['FreeRTOS'],
      ['Communication protocols', [[5, 76], [5, 77], [5, 80], [5, 84], [5, 82]]]]],
    ['Advance', '#FF8A3D', [
      ['IoT foundations', [[9, 50], [9, 51], [9, 73], [5, 66], [5, 64]]],
      ['Wi-Fi, Bluetooth and OTA on ESP32', [[9, 72], [9, 74], [9, 75], [9, 86]]],
      ['Cloud with AWS IoT', [[9, 52], [9, 53], [9, 54], [9, 59], [9, 56]]],
      ['IoT security', [[9, 99], [9, 100], [9, 101]]]]],
    ['Pro', '#C77DFF', [
      ['Industrial IoT and machine monitoring', [[8, 42], [8, 45], [8, 90], [8, 91]]],
      ['Your career: portfolio and focus', [[6, 29], [5, 39], [5, 40]]],
      ['Edge AI and ML'], ['Embedded Linux'], ['Computer vision'], ['App and web for devices']]]
  ];
  var IDS = [5, 4, 10, 9, 8, 6];
  var ALTRON_CLASS = [61, 26, 32, 36, 105, 106, 107];
  var ICON = { notes: '📄', video: '🎬', code: '💻', test: '📝', github: '🔧', project: '🛠', resource: '📎' };
  var KIND = { notes: 'Notes', video: 'Video', code: 'Code', test: 'Test', github: 'Project', project: 'Project', resource: 'Resource' };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function token() { try { var v = store('flutter.student_token'); return v ? JSON.parse(v) || '' : ''; } catch (e) { return ''; } }
  function hdr() { var t = token(); return t ? { Authorization: 'Bearer ' + t } : {}; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function done(id) { return store('altro_done_' + id) === '1'; }
  function funnel(ev, detail) {
    try {
      var v = store('altro_visitor'); if (!v) { v = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); store('altro_visitor', v); }
      fetch(API + '/funnel/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: ev, visitor_id: v, detail: detail || '' }), keepalive: true });
    } catch (e) {}
  }
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest && t.closest('[data-signout]')) {
      e.preventDefault();
      try { localStorage.removeItem('flutter.student_token'); localStorage.removeItem('altro_admin'); } catch (x) {}
      location.href = '/learn?signed_out=1';
      return;
    }
    if (t.closest && t.closest('[data-outline]')) { var sh = document.querySelector('.shell'); if (sh) sh.classList.toggle('outline-on'); var cu = document.querySelector('.side .it.on'); if (cu) cu.scrollIntoView({ block: 'center' }); return; }
    if (t.closest && t.closest('[data-admin]')) { e.preventDefault(); openAdmin(); return; }
    var open = document.querySelector('details.acct[open]');
    if (open && !(t.closest && t.closest('details.acct'))) open.removeAttribute('open');
  });
  // A team number (the admin's own phone or Settings > Admin login numbers) signed in here opens the admin with the
  // same sign-in: the admin session is written where the app reads it (31 Oct 2026, founder).
  function checkAdmin() {
    if (!token()) { store('altro_admin', ''); return; }
    getJSON('/student/admin-access').then(function (d) {
      var was = store('altro_admin') === '1';
      store('altro_admin', d && d.admin ? '1' : '');
      if (!was && d && d.admin) location.reload();
    }).catch(function () {});
  }
  function openAdmin() {
    getJSON('/student/admin-access', { method: 'POST' }).then(function (d) {
      try {
        localStorage.setItem('flutter.token', JSON.stringify(d.token));
        localStorage.setItem('flutter.jwt_token', JSON.stringify(d.jwt_token));
        localStorage.setItem('flutter.role', JSON.stringify(d.role));
        localStorage.setItem('flutter.institute_id', String(d.institute_id));
        localStorage.setItem('flutter.institute_name', JSON.stringify(d.name || ''));
      } catch (x) {}
      location.href = '/dashboard';
    }).catch(function (e) { alert((e && e.detail) || 'Could not open the admin just now. Please try again.'); });
  }
  function signIn() { location.href = '/signin?next=' + encodeURIComponent(location.pathname + location.search); }
  function getJSON(path, opts) {
    return fetch(API + path, Object.assign({ headers: hdr() }, opts || {})).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw Object.assign(j || {}, { status: r.status }); return j; }); });
  }
  // A GitHub project opens in VS Code (founder, 31 Oct 2026): vscode.dev in the browser, or cloned into VS Code on the laptop.
  function projectLinks(link) {
    var m = /^https?:\/\/github\.com\/([^\/?#]+)\/([^\/?#]+)(.*)$/.exec(link);
    if (!m) return '<a class="btn btn-main" href="' + esc(link) + '" target="_blank" rel="noopener">Open the project</a>';
    var repo = m[2].replace(/\.git$/, '');
    var web = 'https://vscode.dev/github/' + m[1] + '/' + repo + m[3].replace(/\.git$/, '');

      pk.querySelectorAll('[data-l]').forEach(function (b) { b.onclick = function () { startAI(b.dataset.l); }; });
      setTimeout(function () { document.addEventListener('click', function off(ev) { if (!pk.contains(ev.target)) { pk.remove(); document.removeEventListener('click', off); } }); }, 0);
    };
    // An experiment (code or a project to build): done best in the Altrobyte Trainer desktop app, which builds, uploads and
    // checks it on the learner's own board (3 Nov 2026, founder). The download shows only once the installer is published.
    if (it.type !== 'notes' && it.type !== 'test' && !yt(it.youtube_url)) {
      var pad = main.querySelector('.body .pad');
      if (pad) {
        var card = document.createElement('div'); card.className = 'card desk';
        card.innerHTML = '<b>🖥️ Do this experiment in the Altrobyte Trainer app</b><p class="muted" style="margin:4px 0 10px;font-size:14px">' +
          'The desktop app opens the project, builds and uploads it to your board, and Altron checks your wiring and what your board prints, step by step. Notes and Learn with AI work there too.</p><div class="row" id="deskdl"><span class="muted" style="font-size:13px">Checking the download…</span></div>';
        pad.insertBefore(card, pad.firstChild.nextSibling);
        // Until it is published, the team's test build (downloads/team/) shows for admins only (5 Nov 2026, founder).
        var team = store('altro_admin') === '1';
        function info(dir) { return fetch('/downloads/' + dir + 'desktop.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) { d.dir = dir; return d; }); }
        info('').catch(function () { if (team) return info('team/'); throw 0; }).then(function (d) {
          document.getElementById('deskdl').innerHTML = '<a class="btn btn-main" href="/downloads/' + d.dir + esc(d.file || 'AltrobyteTrainerSetup.exe') + '" data-dl>Download for Windows</a>' +
            '<span class="muted" style="font-size:13px">v' + esc(d.version || '') + (d.size ? ' · ' + Math.round(d.size / 1048576) + ' MB' : '') + (d.dir ? ' · team test build, learners do not see this yet' : '') + '</span>';
          var a = card.querySelector('[data-dl]'); if (a) a.onclick = function () { funnel('desktop_download', String(it.id)); };
        }).catch(function () {
          document.getElementById('deskdl').innerHTML = '<span class="muted" style="font-size:13px">The desktop app is coming soon. Till then, follow the steps on this page.</span>';
        });
      }
    }
    if (it.type === 'notes') root.querySelector('iframe.note').srcdoc = window.altroTutorPage(it.html_content || '', { slides: false });
    var md = document.getElementById('markdone');
    if (md) md.onclick = function () {
      store('altro_done_' + it.id, '1'); funnel('lesson_done', String(it.id));
      var nx = neighbours(it.id)[1];
      if (nx) location.href = '/learn/' + nx.m + '/' + nx.id;
      else md.outerHTML = '<span class="muted" style="font-size:13px">Done ✓ Last open item</span>';
    };
    var cp = document.getElementById('copy');
    if (cp) cp.onclick = function () { try { navigator.clipboard.writeText(root.querySelector('pre.code').textContent); cp.textContent = 'Copied ✓'; } catch (e) {} };
    var fs = document.getElementById('fs');
    if (fs) fs.onclick = function () { if (document.fullscreenElement) document.exitFullscreen(); else root.querySelector('.lv').requestFullscreen().catch(function () {}); };   // only the lesson, not the site bars
    navButtons(it);
    // The note asks the page to open its links (it is sandboxed).
    window.onmessage = function (e) {
      if (typeof e.data !== 'string') return;
      var o; try { o = JSON.parse(e.data); } catch (x) { return; }
      if (o && o.open && /^https?:\/\//.test(o.open)) window.open(o.open, '_blank', 'noopener');
    };
  }

  // ── /learn/live: live classes and recordings ──
  function when(iso) {
    var d = new Date(String(iso).replace(' ', 'T') + (/[zZ+]/.test(String(iso).slice(10)) ? '' : '+05:30'));
    return d.toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });
  }
  function ended(s) {
    var end = new Date(String(s.session_date).replace(' ', 'T') + '+05:30').getTime() + (s.duration_minutes || 60) * 60000;
    return end < Date.now();
  }
  function live() {
    document.title = 'Live classes · Altrobyte Lab';
    root.innerHTML = bar('live') + '<div class="pad" style="margin:0 auto"><h1>Live classes</h1><div class="skel" style="margin-top:16px"></div><div class="skel"></div></div>';
    bindOutline();
    getJSON('/live-sessions').then(function (d) {
      var all = (d.sessions || []).filter(function (s) { return s.session_date; });
      var next = all.filter(function (s) { return !ended(s); }).sort(function (a, b) { return String(a.session_date) < String(b.session_date) ? -1 : 1; });
      var past = all.filter(ended).sort(function (a, b) { return String(a.session_date) < String(b.session_date) ? 1 : -1; });
      var card = function (s, rec) {
        var free = Number(s.price || 0) <= 0;
        return '<div class="card cls">' + (s.banner_url ? '<img loading="lazy" src="' + esc(s.banner_url) + '" alt="">' : '') + '<b>' + esc(s.title) + '</b>' +
          '<span class="muted" style="font-size:13px">' + (s.repeat_label ? '🔁 ' + esc(s.repeat_label) + ' · next ' : '') + when(s.session_date) + ' IST' + (free ? ' · Free' : '') + '</span>' +
          (rec ? (s.recording_url ? '<a class="btn btn-main btn-sm" style="align-self:flex-start" href="' + esc(s.recording_url) + '" target="_blank" rel="noopener">▶ Watch the recording</a>' :
                  '<span class="muted" style="font-size:13px">🔒 Recording for programme learners</span>') :
                 '<a class="btn btn-main btn-sm" style="align-self:flex-start" href="/live-sessions/' + s.id + '">Details and join</a>') + '</div>';
      };
      var recs = past.filter(function (s) { return s.recording_url || Number(s.price || 0) > 0; });
      root.querySelector('.pad').innerHTML = '<h1>Live classes</h1><p class="muted" style="margin-top:6px">Classes with our engineers. The joining link comes on WhatsApp after you register.</p>' +
        '<h2>Coming up</h2>' + (next.length ? '<div class="grid">' + next.map(function (s) { return card(s, false); }).join('') + '</div>' :
          '<div class="card"><b>The next class is being scheduled.</b><p class="muted" style="margin:4px 0 12px;font-size:14px">Get the date on WhatsApp the moment it opens.</p><a class="btn btn-ghost btn-sm" href="https://wa.me/917222977927?text=' + encodeURIComponent('Hi, tell me when the next live class opens.') + '">Tell me on WhatsApp</a></div>') +
        '<h2>Recordings</h2>' + (recs.length ? '<div class="grid">' + recs.map(function (s) { return card(s, true); }).join('') + '</div>' : '<p class="muted">Recordings of past classes appear here.</p>');
    }).catch(function () {
      root.querySelector('.pad').innerHTML = '<h1>Could not load the live classes</h1><p class="muted" style="margin:6px 0 14px">Check the internet and try again.</p><a class="btn btn-main" href="">Try again</a>';
    });
  }

  // ── route ──
  var p = location.pathname.replace(/\/+$/, '');
  var mm = p.match(/^\/learn\/(\d+)\/(\d+)$/);
  if (mm) item(mm[1], mm[2]);
  else if (p === '/learn/live') live();
  else course();
  checkAdmin();

  // The free time with Altron used up (the strip tells this page): show what continues it, once.
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var m; try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!m || m.type !== 'state' || m.state !== 'out_of_minutes' || document.getElementById('aiout')) return;
    var lv = document.querySelector('.lv'); if (!lv) return;
    funnel('ai_credit_used', location.pathname);
    var c = document.createElement('div'); c.id = 'aiout'; c.className = 'card'; c.style.cssText = 'margin:10px 12px;flex:none';
    c.innerHTML = '<b>' + esc(m.text || 'Your free time with Altron is used.') + '</b><div class="row" style="margin-top:10px"><a class="btn btn-main btn-sm" href="/pricing#ai">See the AI plan</a>' +
      '<button class="btn btn-ghost btn-sm" data-golive>Learn Live with Industrial Expert</button></div>';
    lv.appendChild(c);
  });

  // Learn Live with an industrial expert (5 Nov 2026, founder): one fixed button on every /learn page that shows the
  // batches open to join. No prices here; the plans and fees are on /pricing.
  (function () {
    if (p === '/learn/live') return;
    var b = document.createElement('button'); b.className = 'golive'; b.type = 'button';
    b.innerHTML = '<i>👨‍🏭</i><span>Learn Live with Industrial Expert<small>Check batches to join</small></span>';
    document.body.appendChild(b);
    var panel = null;
    document.addEventListener('click', function (e) { var t = e.target.closest && e.target.closest('[data-golive]'); if (t) { e.preventDefault(); b.onclick(e); } });
    b.onclick = function (e) {
      e.stopPropagation();
      if (panel) { panel.remove(); panel = null; return; }
      funnel('learn_live_open', location.pathname);
      panel = document.createElement('div'); panel.className = 'livepanel';
      panel.innerHTML = '<b style="font-size:16px">Learn live with an industrial expert</b><span class="muted" style="font-size:13.5px">Live classes with engineers who build IoT products for industry: your own lab kit, real products, mentor reviews and placement help. Start with a free demo class.</span><div id="lpList" class="muted" style="font-size:13px">Loading the batches…</div>' +
        '<a class="btn btn-main" href="/pricing#live" data-lp="plans">See the live program</a>' +
        // Not sure yet: they leave a number and the team calls (the roadmap's callback form, one lead list).
        '<form class="lpcall"><b style="font-size:14px">Not sure which batch? Get a call</b><span class="muted" style="font-size:12.5px">Our team calls you about the next batch and the fees.</span>' +
        '<input name="name" placeholder="Your name" autocomplete="name" required maxlength="60">' +
        '<input name="phone" placeholder="WhatsApp number" inputmode="tel" autocomplete="tel" required maxlength="16">' +
        '<button class="btn btn-ghost" type="submit">Call me</button><span class="lpmsg muted" style="font-size:12.5px"></span></form>';
      document.body.appendChild(panel);
      panel.querySelector('.lpcall').onsubmit = function (ev) {
        ev.preventDefault();
        var f = ev.target, msg = f.querySelector('.lpmsg'), btn = f.querySelector('button');
        var phone = f.phone.value.replace(/\D/g, '').slice(-10);
        if (phone.length !== 10) { msg.textContent = 'Please enter your 10-digit WhatsApp number.'; return; }
        btn.disabled = true; msg.textContent = 'Sending…';
        var title = (document.querySelector('.lv .tt') || {}).textContent || '';
        fetch(API + '/callback', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: f.name.value.trim(), phone: phone, source: 'learn', note: ('Asked on /learn' + (title ? ' while reading: ' + title : '')).slice(0, 200) }) })
          .then(function (r) { if (!r.ok) throw r; funnel('lead_asked', location.pathname); f.innerHTML = '<b style="font-size:14px">Thanks! Our team will call you soon.</b>'; })
          .catch(function () { btn.disabled = false; msg.innerHTML = 'Could not send just now. <a href="https://wa.me/917222977927">Message us on WhatsApp</a>.'; });
      };
      panel.addEventListener('click', function (ev) { ev.stopPropagation(); var a = ev.target.closest && ev.target.closest('[data-lp]'); if (a) funnel('learn_live_click', a.getAttribute('data-lp')); });
      setTimeout(function () { document.addEventListener('click', function off() { if (panel) { panel.remove(); panel = null; } document.removeEventListener('click', off); }); }, 0);
      fetch(API + '/live-sessions').then(function (r) { return r.json(); }).then(function (d) {
        var now = new Date();
        function next(s) {
          var t = s.session_date ? new Date(s.session_date) : null;
          if (s.repeat_days) { var days = String(s.repeat_days).split(',').map(function (x) { return (Number(x) + 1) % 7; }); for (var i = 0; i < 8; i++) { var c = new Date(now); c.setDate(now.getDate() + i); if (t) c.setHours(t.getHours(), t.getMinutes(), 0, 0); if (days.indexOf(c.getDay()) >= 0 && c > now) return c; } }
          return t && t > now ? t : null;
        }
        var list = (d.sessions || []).map(function (s) { s._n = next(s); return s; }).filter(function (s) { return s._n || s.registration_always_open; })
          .sort(function (a, c) { return (Number(a.price) > 0) - (Number(c.price) > 0) || ((a._n || 9e15) - (c._n || 9e15)); }).slice(0, 4);
        var el = panel && panel.querySelector('#lpList'); if (!el) return;
        el.outerHTML = list.length ? list.map(function (s) {
          var free = Number(s.price) <= 0, when = s._n ? s._n.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' + s._n.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : 'Joining open now';
          return '<div class="lb"><div>' + (free ? '<span class="fr">FREE DEMO</span>' : '') + '<b>' + esc(s.title) + '</b><span>' + esc(when) + '</span></div><a class="btn btn-sm ' + (free ? 'btn-main' : 'btn-ghost') + '" data-lp="batch ' + s.id + '" href="/live-sessions/' + s.id + '">' + (free ? 'Join free' : 'Details') + '</a></div>';
        }).join('') : '<a class="btn btn-ghost" data-lp="wa" href="https://wa.me/917222977927?text=' + encodeURIComponent('Hi, when does the next live batch start?') + '">Ask for the next batch on WhatsApp</a>';
      }).catch(function () { var el = panel && panel.querySelector('#lpList'); if (el) el.innerHTML = 'Could not load the batches just now.'; });
    };
  })();
})();
</script>
