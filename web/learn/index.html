<html lang="en">
<head>
<meta charset="utf-8">

<title>Learning · Altrobyte Lab</title>
<meta name="description" content="The Altrobyte learning platform: notes, videos, code, tests and projects, step by step, with live classes and their recordings.">
<link rel="icon" href="/favicon.png">

<!-- The learning platform on the web (31 Oct 2026, founder: the roadmap is the syllabus, shared as a page and a PDF;
     "Start learning" opens the learning platform, kept separate, with a full-screen mode on the web).
       /learn            the course: levels and steps; every step brings its notes, videos, code, tests and projects
       /learn/<m>/<c>    one item of a step (the course stays beside it on a wide screen)
       /learn/live       live classes: the next ones and the recordings (recordings open for programme learners)
     Plain HTML, so it opens at once on a phone (the Flutter pages took 15-20 s). Sign-in is the app's /signin (same
     browser storage). The server decides what is open: four lessons free with an account, the rest with a plan. -->
<style>
  :root { --ink:#0A1220; --ink2:#0F1B2E; --panel:#13223A; --panel2:#182A45; --line:#22344F; --text:#E8EEF6; --soft:#9DB0C6; --orange:#FF6A1A;
          --green:#2BD47D; --gold:#D9A441; --cyan:#38E1D3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--text); font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; border: 0; cursor: pointer; white-space: nowrap; }
  .btn-main { background: var(--orange); color: #fff; }
  .btn-ghost { border: 1px solid var(--line); background: transparent; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  /* Altron meter (10 Nov 2026): the learner's minutes, why to upgrade, and the buttons, on every page */
  .meter { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 600 12.5px Inter, sans-serif; cursor: pointer; white-space: nowrap; }
  .meter.low { border-color: var(--orange); color: #FFB37A; background: #2A1708; }
  .meter.out { border-color: #ef4444; color: #fca5a5; background: #2a0f12; }
  .meterbox { position: fixed; top: 60px; right: 12px; z-index: 40; width: min(340px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 18px 50px -12px rgba(0,0,0,.6); }
  .meterbox h4 { font-size: 15px; margin: 0 0 8px; } .meterbox .gauge { height: 8px; border-radius: 99px; background: var(--ink2); overflow: hidden; margin: 6px 0 4px; }
  .meterbox .gauge i { display: block; height: 100%; background: linear-gradient(90deg, #38E1D3, var(--orange)); }
  .meterbox .fomo { font-size: 13px; color: #FFB37A; margin: 10px 0 0; } .meterbox .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .meterbox .ct { font-size: 12.5px; color: var(--soft); margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; } .meterbox .ct a { color: #FF9A3D; }
  @media (max-width: 520px) { .meter .w { display: none; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 16px; background: var(--ink2); border-bottom: 1px solid var(--line); }

  .tabs a.on { background: var(--panel); color: #fff; }
  .bar .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  .acct .menu { position: absolute; right: 0; top: 42px; z-index: 50; min-width: 220px; background: var(--panel); border: 1px solid var(--line, rgba(255,255,255,.12)); border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .acct .menu a { display: block; padding: 10px 12px; border-radius: 8px; color: inherit; text-decoration: none; font-size: 14px; }
  .acct .menu a:hover { background: var(--panel2); }

  .me { width: 32px; height: 32px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-weight: 700; color: var(--orange); }
  @media (max-width: 640px) { .logo span { display: none; } .tabs { margin-left: 0; } }

  /* course layout: outline + content */
  .shell { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 56px); height: calc(100dvh - 56px); }
  .side { overflow-y: auto; border-right: 1px solid var(--line); background: var(--ink2); padding: 14px 10px 40px; }

  @media (max-width: 900px) { .shell { display: flex; flex-direction: column-reverse; height: auto; } .side { border: 0; background: none; padding: 0 12px 40px; } .shell.reading { height: calc(100dvh - 56px); } .shell.reading .side { display: none; } .shell.reading .main { flex: 1; } }
  .lvl { margin: 12px 6px 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .step { border-radius: 10px; margin-bottom: 4px; }

  .tag.live { background: rgba(217,164,65,.15); color: var(--gold); }

  /* welcome / panels */
  .pad { padding: 28px 28px 30px; max-width: 860px; }
  @media (max-width: 900px) { .pad { padding: 18px 14px 20px; } }
  h1 { font-size: 22px; line-height: 1.25; }
  h2 { font-size: 17px; margin: 26px 0 10px; }

  .prog { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0 4px; }
  .prog i { display: block; height: 100%; background: var(--green); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .cls { display: flex; flex-direction: column; gap: 6px; }
  .cls img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--panel2); }
  .cls b { font-size: 15px; line-height: 1.3; }
  .skel { height: 46px; border-radius: 10px; margin: 6px; background: linear-gradient(90deg, var(--panel), var(--panel2), var(--panel)); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* an item */
  .lv { display: flex; flex-direction: column; height: 100%; }
  .lv .top { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--ink2); flex: none; }
  .lv .top .tt { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv .top .tt small { display: block; font-weight: 400; color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: none; cursor: pointer; display: grid; place-items: center; flex: none; }
  .lv:fullscreen { background: var(--ink); }
  .lv iframe.note { flex: 1; width: 100%; border: 0; background: #fff; }
  .lv .body { flex: 1; overflow-y: auto; }
  .video { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
  pre.code { background: #0B1424; border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; font: 13px/1.5 "Spline Sans Mono", Consolas, monospace; color: #DDE6F2; white-space: pre; }
  .foot { flex: none; display: flex; gap: 10px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--ink2); }
  .foot .muted { flex: 1; font-size: 13px; }
  .strip { flex: none; height: 64px; display: flex; border-top: 1px solid var(--line); }
  .strip iframe { flex: 1; border: 0; }
  @media (max-width: 900px) { .hide-s { display: none; } }

  /* in the Android app the app has its own tabs and sign-in */
  .inapp .bar { display: none; }
  .inapp .shell, .inapp .shell.reading { height: 100vh; height: 100dvh; }
  .aipick { position: fixed; z-index: 50; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; width: 270px; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .card.desk { margin: 12px 0 16px; }
  .golive { position: fixed; right: 18px; bottom: 84px; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #FF6A1A, #FF9A3D); color: #fff; font: 700 14.5px Inter, system-ui, sans-serif; box-shadow: 0 12px 30px -8px rgba(255,106,26,.75); }
  .golive i { font-style: normal; font-size: 18px; } .golive small { display: block; font-weight: 500; font-size: 11.5px; opacity: .9; text-align: left; }
  .golive:hover { transform: translateY(-2px); }
  @media (max-width: 600px) { .golive { right: 12px; bottom: 78px; padding: 10px 14px; font-size: 13.5px; } .golive small { display: none; } }
  .livepanel { position: fixed; right: 18px; bottom: 150px; z-index: 41; width: min(380px, calc(100vw - 24px)); max-height: min(70vh, 560px); overflow-y: auto; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 10px; }
  @media (max-width: 600px) { .livepanel { right: 12px; bottom: 132px; } }
  .livepanel .lb { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .livepanel .lb b { font-size: 14px; display: block; } .livepanel .lb span { font-size: 12.5px; color: var(--soft); }
  .livepanel .lpcall { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .livepanel .lpcall input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink2); color: inherit; font: inherit; font-size: 14px; }
  .livepanel .fr { color: #38E1D3; font-weight: 800; font-size: 11px; letter-spacing: .08em; }
  .sum { flex: none; border-bottom: 1px solid var(--line); background: var(--ink2); padding: 8px 14px; font-size: 14px; }
  .sum summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; } .sum summary::-webkit-details-marker { display: none; }
  .sum summary::before { content: '▸'; color: var(--orange2, #FF9A3D); } .sum[open] summary::before { content: '▾'; }
  .sum summary span { color: var(--soft); font-size: 13px; } .sum ol { margin: 8px 0 4px 20px; columns: 2; column-gap: 28px; color: var(--soft); }
  @media (max-width: 700px) { .sum ol { columns: 1; } }
  .focus .bar, .focus .sum { display: none; }

  .focus .lv .top .iconbtn { width: 32px; height: 32px; }
  .focus .lv .top .btn-sm { padding: 5px 10px; }
  .focus .strip { height: 56px; }
  .side .subt { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #8a9bb3; padding: 10px 12px 4px; }
  /* /learn opens on the roadmap itself, full width (6 Nov 2026, founder: "the roadmap is what we sell, first view"). */
  .rm { max-width: 1180px; margin: 0 auto; padding: 22px 20px 120px; }
  @media (max-width: 600px) { .rm { padding: 16px 16px 120px; } }
  .rm-hero { display: flex; gap: 18px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  .rm-hero .k { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--orange); }

  .rm-hero .st { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .rm-hero .st span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: #cfd9e6; }
  .rm-hero .st b { color: #fff; }
  .rm-go { display: grid; gap: 6px; min-width: 0; max-width: 100%; }

  .stage { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 0 14px; padding-top: 26px; }

  .stage:last-of-type::before { display: none; }

  @media (max-width: 600px) { .stage { grid-template-columns: 34px 1fr; gap: 0 10px; } .stage .dot { width: 34px; height: 34px; font-size: 14px; } .stage::before { display: none; }
    .topics { grid-column: 1 / -1; grid-template-columns: 1fr; } }
  .tp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }

  /* Below the roadmap (8 Nov 2026, founder): why learn here, who teaches, what learners say and build, the kit, the

      }).catch(function () { var el = panel && panel.querySelector('#lpList'); if (el) el.innerHTML = 'Could not load the batches just now.'; });
