<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live classes · Altrobyte Lab</title>
<meta name="description" content="Live workshops and classes on embedded systems, PCB design, IoT and AI, taught by engineers who ship real products.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://edu.altrobytelab.com" crossorigin>
<!-- The live classes, as a plain page (30 Oct 2026, founder: every page of the app took too long; a WhatsApp link to a
     workshop must open at once). Registering, OTP and payment stay in the app at /join/<id>, which this page warms up. -->
<style>
  :root { --ink:#0A1220; --panel:#13223A; --line:#22344F; --text:#E8EEF6; --soft:#9DB0C6; --orange:#FF6A1A; --orange2:#FF9A3D; --cyan:#38E1D3; --green:#25D366; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink); color: var(--text); font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }
  nav { position: sticky; top: 0; z-index: 5; background: rgba(10,18,32,.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06); }
  nav .wrap { display: flex; align-items: center; height: 60px; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
  .logo img { width: 28px; height: 28px; border-radius: 7px; }
  nav .r { margin-left: auto; display: flex; gap: 14px; font-size: 14px; color: var(--soft); align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 22px; border-radius: 999px; font-weight: 700; font-size: 16px; border: 0; cursor: pointer; }
  .btn-main { background: linear-gradient(135deg, var(--orange), var(--orange2)); color: #fff; box-shadow: 0 10px 30px -10px rgba(255,106,26,.7); }
  .btn-ghost { border: 1px solid rgba(255,255,255,.22); color: #fff; }
  .muted { color: var(--soft); }
  h1 { font-size: clamp(24px, 4.5vw, 36px); line-height: 1.2; letter-spacing: -.02em; }
  .hero { display: grid; grid-template-columns: 340px 1fr; gap: 28px; padding: 28px 0; align-items: start; }
  .poster { width: 100%; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .chip { font-size: 13.5px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .price { font-size: 30px; font-weight: 800; margin: 10px 0 2px; }
  .price s { font-size: 18px; color: var(--soft); font-weight: 500; margin-left: 8px; }
  .ended { display: inline-block; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--soft); font-weight: 700; font-size: 13px; }
  .desc { margin: 10px 0 40px; padding: 22px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
  .desc h1, .desc h2, .desc h3 { font-size: 20px; margin: 14px 0 6px; }
  .desc p, .desc li { color: #cfdbe8; } .desc ul, .desc ol { padding-left: 22px; } .desc img { max-width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 10px 0 40px; }
  .card { border-radius: 18px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: #0d1828; }
  .card .b { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card b { font-size: 16px; line-height: 1.35; }
  .sec { font-size: 20px; margin: 26px 0 4px; }
  .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .sticky { display: none; }
  footer { border-top: 1px solid var(--line); padding: 22px 0 90px; font-size: 13.5px; color: var(--soft); }
  @media (max-width: 760px) {
    nav .r a:not(.btn) { display: none; }
    .hero { grid-template-columns: 1fr; gap: 18px; padding-top: 16px; }
    .poster { max-width: 420px; margin: 0 auto; }
    .sticky { display: flex; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: rgba(10,18,32,.96); border-top: 1px solid var(--line); z-index: 6; }
    .sticky .btn { width: 100%; }
  }
  .skel { height: 18px; border-radius: 8px; background: linear-gradient(90deg, #13223A, #1b2f4d, #13223A); background-size: 200% 100%; animation: sh 1.2s infinite; margin: 10px 0; }
  @keyframes sh { to { background-position: -200% 0; } }
  .inapp nav { display: none !important; }   /* in the Android app, which has its own tabs */
</style>
<script>if (/AltrobyteApp/.test(navigator.userAgent)) document.documentElement.className += ' inapp';</script>

</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="/"><img src="/icons/Icon-192.png" alt="">Altrobyte Lab</a>
  <div class="r"><a href="/live-sessions">Live classes</a><a href="/pricing">Pricing</a><a class="btn btn-ghost" style="padding:8px 14px;font-size:14px" href="/signin">Log in</a></div>
</div></nav>
<main class="wrap" id="app"><div style="padding:30px 0"><div class="skel" style="width:60%;height:30px"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div></main>
<div class="sticky" id="sticky"></div>
<footer><div class="wrap">Altrobyte Lab by Altrobyte Automation · <a href="/">Home</a> · <a href="/contact">Contact</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></div></footer>
<script>
(function () {
  var API = 'https://edu.altrobytelab.com';
  var app = document.getElementById('app'), sticky = document.getElementById('sticky');
  var m = location.pathname.match(/^\/live-sessions\/(\d+)/);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(iso) {
    if (!iso) return 'Date to be announced';
    // Stored in IST without a zone.
    var d = new Date(iso.replace(' ', 'T') + (/[zZ+]/.test(iso.slice(10)) ? '' : '+05:30'));
    return d.toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' }) + ' IST';
  }
  // The list files a class whose date has gone under Past even when its registration was left open (31 Oct 2026: old
  // workshops kept showing as open); its own page still takes registrations. A repeating class always carries its
  // next run, so it never goes under Past.
  function past(s, inList) {
    if (s.registration_always_open && !inList) return false;
    if (!s.session_date) return false;
    var end = new Date(s.session_date.replace(' ', 'T') + '+05:30').getTime() + (s.duration_minutes || 60) * 60000;
    return end < Date.now();
  }
  function money(n) { return '₹' + Number(n).toLocaleString('en-IN'); }
  function priceHtml(s) {
    var p = Number(s.price || 0);
    if (p <= 0) return '<div class="price" style="color:var(--green)">Free</div>';
    return '<div class="price">' + money(p) + (s.original_price && s.original_price > p ? '<s>' + money(s.original_price) + '</s>' : '') + '</div>' +
      (s.tax_percent ? '<div class="muted" style="font-size:13px">+ ' + s.tax_percent + '% GST</div>' : '');
  }
  function fail() {
    app.innerHTML = '<div style="padding:40px 0"><h1>Could not load the live classes</h1><p class="muted" style="margin:8px 0 18px">Check the internet and try again.</p><a class="btn btn-main" href="">Try again</a></div>';
  }
  function warmApp() {
    // Fetch the app's code while the visitor reads, so Register opens quickly.
    ['/main.dart.js', '/flutter_bootstrap.js'].forEach(function (u) { var l = document.createElement('link'); l.rel = 'prefetch'; l.href = u; document.head.appendChild(l); });
  }
  function card(s) {
    var over = past(s, true);
    return '<a class="card" href="/live-sessions/' + s.id + '">' + (s.banner_url ? '<img loading="lazy" src="' + esc(s.banner_url) + '" alt="">' : '') +
      '<div class="b"><b>' + esc(s.title) + '</b><span class="muted" style="font-size:13.5px">' + (s.repeat_label ? '🔁 ' + esc(s.repeat_label) + ' · next ' : '') + when(s.session_date) + '</span>' +
      (over ? '<span class="ended">Ended</span>' : priceHtml(s).replace('class="price"', 'class="price" style="font-size:20px;margin:0"')) + '</div></a>';
  }
  if (!m) {
    fetch(API + '/live-sessions').then(function (r) { return r.json(); }).then(function (d) {
      var all = d.sessions || [], up = all.filter(function (s) { return !past(s, true); }), done = all.filter(function (s) { return past(s, true); }).reverse();
      document.title = 'Live classes · Altrobyte Lab';
      app.innerHTML = '<div style="padding:28px 0 6px"><h1>Live classes and workshops</h1><p class="muted">Build along with engineers who ship real products.</p></div>' +
        '<h2 class="sec">Open for registration</h2>' + (up.length ? '<div class="grid">' + up.map(card).join('') + '</div>' :
          '<p class="muted" style="margin:8px 0 10px">The next class is being scheduled. Get the date on WhatsApp the moment it opens.</p><div class="cta"><a class="btn btn-main" href="https://wa.me/917222977927?text=Please%20tell%20me%20when%20the%20next%20Altrobyte%20live%20class%20opens.">Tell me on WhatsApp</a><a class="btn btn-ghost" href="/class">Try a free class with Altron</a></div>') +
        (done.length ? '<h2 class="sec">Past classes</h2><div class="grid">' + done.map(card).join('') + '</div>' : '');
      warmApp();
    }).catch(fail);
    return;
  }
  var id = m[1];
  fetch(API + '/live-sessions/' + id).then(function (r) { if (r.status === 404) throw 404; return r.json(); }).then(function (s) {
    var over = past(s), free = Number(s.price || 0) <= 0;
    document.title = s.title + ' · Altrobyte Lab';
    var go = '/join/' + id;
    var main = over ? '<span class="ended">This class has ended</span>' :
      '<a class="btn btn-main" href="' + go + '">' + (free ? 'Register free' : 'Register now') + '</a>';
    app.innerHTML = '<div class="hero">' + (s.banner_url ? '<img class="poster" src="' + esc(s.banner_url) + '" alt="">' : '<div></div>') +
      '<div><h1>' + esc(s.title) + '</h1><div class="chips">' + (s.repeat_label ? '<span class="chip" style="border-color:var(--cyan);color:var(--cyan)">🔁 ' + esc(s.repeat_label) + '</span>' : '') + '<span class="chip">📅 ' + (s.repeat_label ? 'Next: ' : '') + when(s.session_date) + '</span>' +
      (s.duration_minutes ? '<span class="chip">⏱ ' + (s.duration_minutes >= 60 ? (s.duration_minutes / 60) + (s.duration_minutes === 60 ? ' hour' : ' hours') : s.duration_minutes + ' min') + '</span>' : '') +
      (s.platform ? '<span class="chip">🎥 Live on ' + esc(s.platform) + '</span>' : '') + (s.host_name ? '<span class="chip">👤 ' + esc(s.host_name) + '</span>' : '') +
      (s.registration_count > 5 ? '<span class="chip">✅ ' + s.registration_count + ' registered</span>' : '') + '</div>' +
      (over ? '' : priceHtml(s)) + '<div class="cta">' + main + (over ? '<a class="btn btn-ghost" href="/live-sessions">See upcoming classes</a>' : '') + '</div>' +
      (over ? '' : '<p class="muted" style="font-size:13.5px;margin-top:10px">Sign in with your WhatsApp number. The joining link comes on WhatsApp.</p>') +
      '</div></div>' + (s.description_html ? '<div class="desc">' + s.description_html + '</div>' : '');
    if (!over) { sticky.innerHTML = main; warmApp(); } else sticky.remove();
  }).catch(function (e) {
    if (e === 404) app.innerHTML = '<div style="padding:40px 0"><h1>This class is not available</h1><p class="muted" style="margin:8px 0 18px">It may have been removed.</p><a class="btn btn-main" href="/live-sessions">See live classes</a></div>';
    else fail();
  });
})();
</script>
</body>
</html>
