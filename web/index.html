  <!-- Rescue for links shared before this app used real paths.
       Flutter's old default put the route after a "#", and a fragment is
       never sent to the server: /#/roadmap/x arrives as "/" and the reader
       lands on the homepage wondering what they clicked. Those links are in
       WhatsApp forwards we cannot recall, so translate them here, before the
       router boots and before anything is painted. -->
  <script>
  (function () {
    var h = location.hash;
    if (h.length > 2 && h.charAt(1) === '/') {
      history.replaceState(null, '', h.slice(1) + location.search);
    }
  })();
  </script>

  <!-- Per-route title, description and canonical.
       A single-page app serves one HTML file for every URL, so without this
       every page would share the homepage's title, and a static canonical
       would tell Google the whole site is a duplicate of "/". The map is
       deliberately small: only routes we would be glad to be found on. -->
  <script>
  (function () {
    var META = {
      '/': ['Altrobyte Lab - Learn Embedded, PCB and IoT by Building Real Products',
            'Hands-on embedded systems, PCB design and IoT training in Indore. Build real industrial products, not tutorials.'],
      '/program': ['Product Engineering Program - 165 Milestones, Real Hardware | Altrobyte Lab',
            'Build 3-4 real industrial products in one program. Schematic to PCB, firmware, cloud and AI. Intensive or weekend track, online or at Indore.'],
      '/demo': ['Free Demo Classes - Altrobyte Lab',
            'Sit in on a real embedded and IoT session before you decide anything. Free, no account needed.'],
      '/book': ['Book a Call - Altrobyte Lab',
            'Pick a time and we will call you about the Product Engineering Program. No payment, no commitment.'],
      '/pricing': ['Pricing - Altrobyte Lab',
            'Platform access, live workshops and the Product Engineering Program.'],
      '/placements': ['Placements and Results - Altrobyte Lab',
            'Where our students work now, and what they said about getting there.'],
      '/services': ['Services - Altrobyte Lab',
            'Product engineering, embedded development and PCB design for teams building hardware.'],
      '/products': ['Lab Setups and Products - Altrobyte Lab',
            'Complete embedded and IoT lab setups for colleges and institutes.'],
      '/institutes': ['For Colleges and Institutes - Altrobyte Lab',
            'Bring a working embedded and IoT lab to your campus, with curriculum and trainers.'],
      '/events': ['Workshops and Events - Altrobyte Lab',
            'Upcoming hands-on workshops in embedded systems, PCB design and IoT.'],
      '/jobs': ['Embedded and IoT Job Updates - Altrobyte Lab',
            'Curated embedded systems, firmware and hardware openings for engineers in India.'],
      '/partner': ['Partner With Us - Altrobyte Lab',
            'Run Altrobyte Lab programs at your college, institute or company.'],
      '/about': ['About - Altrobyte Lab', 'Why we teach engineering by building products.'],
      '/founder': ['Founder - Altrobyte Lab', 'The person behind Altrobyte Lab.'],
      '/contact': ['Contact - Altrobyte Lab', 'Talk to us about programs, workshops or lab setups.'],
      '/privacy': ['Privacy Policy - Altrobyte Lab', 'What we collect, why, and how to have it removed.'],
      '/terms': ['Terms and Conditions - Altrobyte Lab', 'Terms of use for Altrobyte Lab.'],
      '/refunds': ['Refund Policy - Altrobyte Lab', 'When and how refunds are issued.']
    };

    function put(tag, keyAttr, keyVal, valAttr, val) {
      var el = document.head.querySelector(tag + '[' + keyAttr + '="' + keyVal + '"]');
      if (!el) {
        el = document.createElement(tag);
        el.setAttribute(keyAttr, keyVal);
        document.head.appendChild(el);
      }
      el.setAttribute(valAttr, val);
    }

    function apply() {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var m = META[path];
      // A roadmap URL carries its own subject. Anything unmapped keeps the
      // site defaults rather than inheriting the homepage's claims.
      if (!m && path.indexOf('/roadmap/') === 0) {
        m = ['Engineering Roadmap - Altrobyte Lab',
             'A milestone-by-milestone roadmap from first principles to a working product.'];
      }
      if (m) {
        document.title = m[0];
        put('meta', 'name', 'description', 'content', m[1]);
        put('meta', 'property', 'og:title', 'content', m[0]);
        put('meta', 'property', 'og:description', 'content', m[1]);
        put('meta', 'name', 'twitter:title', 'content', m[0]);
        put('meta', 'name', 'twitter:description', 'content', m[1]);
      }
      var url = 'https://lab.altrobyte.com' + path;
      put('link', 'rel', 'canonical', 'href', url);
      put('meta', 'property', 'og:url', 'content', url);
    }

    apply();
    // go_router pushes state rather than reloading, so the tags have to follow.
    var push = history.pushState;
    history.pushState = function () { push.apply(this, arguments); setTimeout(apply, 0); };
    var rep = history.replaceState;
    history.replaceState = function () { rep.apply(this, arguments); setTimeout(apply, 0); };
    window.addEventListener('popstate', function () { setTimeout(apply, 0); });
  })();
  </script>

  <link rel="manifest" href="manifest.json">
  <style>
    #splash {
      position: fixed; inset: 0;
      background: linear-gradient(160deg, #1A3C5E 0%, #0F2540 100%);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; z-index: 9999;
      transition: opacity 0.35s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #splash .logo-wrap {
      position: relative; width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
    }
    #splash .logo-wrap::before {
      content: ''; position: absolute; inset: -10px;
      border-radius: 24px; background: rgba(212,80,10,0.25);
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    #splash img { width: 80px; height: 80px; border-radius: 18px; position: relative; }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(0.92); opacity: 0.5; }
      50% { transform: scale(1.12); opacity: 0.15; }
    }
    #splash .msg {
      margin-top: 28px; color: rgba(255,255,255,0.85);
      font-size: 14.5px; font-weight: 500; letter-spacing: 0.2px;
      min-height: 20px; text-align: center; padding: 0 24px;
      transition: opacity 0.4s ease;
    }
    #splash .dots { margin-top: 16px; display: flex; gap: 6px; }
    #splash .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #D4500A; opacity: 0.35;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    #splash .dots span:nth-child(2) { animation-delay: 0.15s; }
    #splash .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes splash-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-wrap"><img src="icons/Icon-192.png" alt="AltrobyteLab"></div>
    <div class="msg" id="splash-msg">Warming up your workshop...</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
  <script>
    // A bare spinner on a plain white/navy screen reads as "broken" on a
    // slow connection — rotating short, upbeat lines make the same wait
    // feel intentional instead of stuck. Purely cosmetic; load time itself
    // is unaffected by this part.
    var _splashMessages = [
      'Warming up your workshop...',
      'Good things are worth a short wait...',
      'Getting your seat ready...',
      'Almost there — loading the good stuff...',
      'Preparing something worth building...'
    ];
    var _splashIdx = 0;
    var _splashMsgEl = document.getElementById('splash-msg');
    var _splashTimer = setInterval(function () {
      if (!_splashMsgEl) { clearInterval(_splashTimer); return; }
      _splashIdx = (_splashIdx + 1) % _splashMessages.length;
      _splashMsgEl.style.opacity = 0;
      setTimeout(function () {
        if (_splashMsgEl) {
          _splashMsgEl.textContent = _splashMessages[_splashIdx];
          _splashMsgEl.style.opacity = 1;
        }
      }, 400);
    }, 2200);

    // Remove the splash the moment Flutter renders its first frame — plus a
    // hard safety-net timeout so a missed/renamed event can never again
    // leave this stuck on screen forever (this exact bug just happened).
    function removeSplash() {
      clearInterval(_splashTimer);
      var el = document.getElementById('splash');
      if (el) el.remove();
    }
    window.addEventListener('flutter-first-frame', removeSplash);
    setTimeout(removeSplash, 6000);
  </script>
  <!-- deferred: this is only needed once a user actually opens the payment
       page, not during initial boot — without defer, Flutter's own boot
       script below had to wait for this third-party domain to respond first. -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js" defer></script>
  <script>
    // Cashfree's Orders API payment_session_id only works through their JS
    // Checkout SDK (cashfree.checkout()) — a raw redirect to
    // payments.cashfree.com/order/#session_xxx skips the SDK handshake and
    // Cashfree's hosted page rejects it as "client session is invalid",
    // even for a session that was just created. This wraps that SDK call
    // so Dart can invoke it with a plain function call.
    window.altrobyteCashfreeCheckout = function (sessionId, mode) {
      try {
        var cashfree = new Cashfree({ mode: mode || 'production' });
        // '_self' only actually keeps the browser on the same tab when the
        // checkout() call happens synchronously inside a user click — ours
        // fires after an awaited network call (creating the order first),
        // by which point the browser no longer treats it as a direct user
        // gesture, so it was silently falling back to opening a new tab.
        // '_modal' renders the checkout as an overlay on THIS page instead,
        // sidestepping that entirely — no new tab, ever.
        cashfree.checkout({ paymentSessionId: sessionId, redirectTarget: '_modal' }).then(function () {
          window.dispatchEvent(new CustomEvent('altrobyte-cashfree-done'));
        });
      } catch (e) {
        alert('Payment could not start: ' + (e && e.message ? e.message : e));
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
