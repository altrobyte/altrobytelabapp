<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cattle Feed Plant 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-screen 3D plant; floating glass panels: brand (top-left), controls (top-right), info (right / bottom sheet), SCADA (left, automation mode), section chips (bottom). Single dark control-room look by choice. */
:root{
  --bg:#0E141B; --panel:rgba(16,24,33,.86); --line:rgba(150,175,200,.18); --ink:#E8EEF4; --muted:#93A3B4;
  --accent:#F2A93B; --steel:#7FB2E0; --ok:#3FCB86; --warn:#F2A93B; --bad:#F2555A;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
.panel{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;z-index:5}
#brand{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:12px 16px;max-width:min(360px,calc(100vw - 24px))}
#brand .eyebrow{font:600 11px var(--mono);letter-spacing:.14em;color:var(--accent)}
#brand h1{margin:2px 0 0;font:700 26px/1.05 var(--display);letter-spacing:.01em}
#brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
#controls{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 24px)}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:10px;padding:3px}
.seg button,.btn{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 12px;border-radius:8px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1A1206}
.btn{background:rgba(255,255,255,.06);color:var(--ink)}
.btn:hover{background:rgba(255,255,255,.12)}
.speed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:0 4px}
.speed input{width:80px;accent-color:var(--accent)}
#sections{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:6px;display:flex;gap:4px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#sections button{white-space:nowrap}
#sections button.on{background:rgba(242,169,59,.18);color:var(--accent)}
#info{right:max(12px,env(safe-area-inset-right,0px));top:calc(76px + env(safe-area-inset-top,0px));width:340px;max-height:calc(100% - 160px);overflow:auto;padding:16px 18px}
#info .tag{display:inline-block;font:600 12px var(--mono);color:#1A1206;background:var(--accent);padding:3px 8px;border-radius:6px}
#info .sec{font:600 11px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-left:8px}
#info h2{margin:10px 0 6px;font:700 24px/1.1 var(--display)}
#info p{margin:0 0 12px;color:#C8D3DE;line-height:1.5}
#info h3{margin:0 0 8px;font:700 13px var(--mono);letter-spacing:.08em;color:var(--steel);text-transform:uppercase}
#info ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
#info li{display:flex;gap:10px;line-height:1.45;color:#DCE4EC}
#info li::before{content:"";flex:none;width:7px;height:7px;margin-top:7px;border-radius:2px;background:var(--steel)}
#info .close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:8px;border:0;background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font-size:18px}
#info .hint{color:var(--muted);font-size:13px}
#scada{left:max(12px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));width:300px;padding:14px 16px;display:grid;gap:12px}
#scada .head{display:flex;justify-content:space-between;align-items:baseline}
#scada .head b{font:700 18px var(--display);letter-spacing:.02em}
#scada .head span{font:500 11px var(--mono);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi small{display:block;color:var(--muted);font-size:11px}
.kpi b{font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.kpi b i{font-style:normal;font-size:11px;color:var(--muted);margin-left:3px}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.lvl{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 10px var(--mono);color:var(--muted)}
.lvl .bar{width:100%;height:54px;border-radius:5px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.lvl .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--ok);transition:height .6s,background .3s}
.alarm{display:flex;gap:8px;align-items:center;font-size:12px;padding:8px 10px;border-radius:9px;background:rgba(63,203,134,.1);color:var(--ok)}
.alarm.on{background:rgba(242,85,90,.14);color:#FF8A8E}
.alarm::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
#legend{left:max(12px,env(safe-area-inset-left,0px));top:calc(130px + env(safe-area-inset-top,0px));padding:12px 14px;display:grid;gap:6px;font-size:12px;color:#C8D3DE}
#legend b{font:700 13px var(--mono);letter-spacing:.08em;color:var(--steel);text-transform:uppercase;margin-bottom:2px}
#legend div{display:flex;align-items:center;gap:8px}
#legend i{width:22px;height:4px;border-radius:2px;flex:none}
#note{right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px 10px;font-size:11px;color:var(--muted);border-radius:8px;max-width:300px}
.lbl{pointer-events:auto;cursor:pointer;font:600 11px var(--mono);color:#E8EEF4;background:rgba(14,20,27,.82);border:1px solid rgba(150,175,200,.35);padding:2px 7px;border-radius:6px;white-space:nowrap;transform:translateY(-6px);transition:background .15s}
.lbl span{color:var(--muted);font-family:var(--body);font-weight:600;margin-left:5px}
.lbl:hover,.lbl.sel{background:var(--accent);color:#1A1206;border-color:var(--accent)}
.lbl:hover span,.lbl.sel span{color:#1A1206}
.nolabels .lbl{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  #brand h1{font-size:21px}
  #brand p{display:none}
  #controls{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);justify-content:center}
  .speed{display:none}
  #controls{flex-wrap:nowrap;padding:5px;gap:5px}
  .seg button,.btn{padding:7px 10px;font-size:12.5px;white-space:nowrap}
  #info{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));max-height:42vh}
  #scada{top:calc(76px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 24px));padding:10px 12px;gap:8px}
  #scada .levels,#scada .alarm{display:none}
  #legend{display:none}
  #note{display:none}
  .lbl{font-size:10px;padding:1px 5px}
}
</style>

</head>
<body>
<div id="stage"></div>

<header class="panel" id="brand">
  <div class="eyebrow">PROCESS &amp; AUTOMATION CONCEPT</div>
  <h1>Cattle Feed Pellet Plant</h1>
</header>

<div class="panel" id="controls">
  <div class="seg" role="group" aria-label="View mode">
    <button id="mProcess" aria-pressed="true">Process</button>
    <button id="mAuto" aria-pressed="false">Automation</button>
  </div>
  <button class="btn" id="play" aria-label="Pause flow">❚❚ Pause</button>
  <label class="speed" for="spd">Speed <input id="spd" type="range" min="0.25" max="3" step="0.25" value="1"></label>
  <button class="btn" id="lblBtn" aria-pressed="true">Labels</button>
</div>


<aside class="panel" id="scada" hidden aria-label="Live SCADA view">
  <div class="head"><b>SCADA · Line 1</b><span>demo values</span></div>
  <div class="kpis">
    <div class="kpi"><small>Throughput</small><b id="kTph">0<i>TPH</i></b></div>
    <div class="kpi"><small>Batch</small><b id="kBatch">0<i>/ day</i></b></div>
    <div class="kpi"><small>Conditioner</small><b id="kTemp">0<i>°C</i></b></div>
    <div class="kpi"><small>Pellet mill load</small><b id="kAmp">0<i>A</i></b></div>
    <div class="kpi"><small>Bags packed</small><b id="kBags">0<i>today</i></b></div>
    <div class="kpi"><small>Energy</small><b id="kEn">0<i>kWh/t</i></b></div>
  </div>
  <div class="levels" id="levels"></div>
  <div class="alarm" id="alarm">All systems normal</div>
</aside>

<aside class="panel" id="info" aria-live="polite"></aside>

<nav class="panel" id="sections" aria-label="Jump to section"></nav>
