<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altron Live</title>
<meta name="theme-color" content="#1e3a5f">
<!--
  Altron by voice (Gemini Live), version 2. Shipped inside the desktop app (served from a folder of the app, so a website
  deploy can never break it) and also published at altrobytelab.com/live/v2/.

  Address:  ?course=<id> | ?note=<id> | ?lab=<id>   what Altron teaches
            &lang=en|hi  &autostart=1  &compact=1    and the learner's sign-in in the #fragment (#t=...), never sent anywhere

  The camera starts OFF. Altron asks for it (the ask_camera tool) and the learner turns it on. In a course, Altron reads
  and answers the steps through the app (get_current_step, answer_for_learner): the page passes those to the app and the
  app's answer back. Every connection is metered by the server: a token covers at most the minutes it allows, and the page
  reports what the connection really used.
-->
<style>
  :root { --navy:#1e3a5f; --navy2:#16304f; --orange:#e8590c; --ok:#3ccf7a; --ink:#0f1c2b; --soft:#b8c6d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--navy); color: #fff; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; font-size: 12.5px; color: var(--soft); }
  .top b { color: #fff; font-size: 13.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8a9bb0; flex: none; }
  .dot.live { background: #ff4d4f; box-shadow: 0 0 0 4px rgba(255,77,79,.22); }
  .dot.talk { background: var(--ok); box-shadow: 0 0 0 4px rgba(60,207,122,.22); }
  .grow { flex: 1; }
  .stage { position: relative; flex: 1; min-height: 0; margin: 4px 10px; border-radius: 14px; background: var(--navy2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #000; }
  .cam-on video { display: block; }
  .orb { width: 78px; height: 78px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9a5a, var(--orange) 55%, #9c3a07); box-shadow: 0 0 0 0 rgba(232,89,12,.5); transition: transform .2s; }
  .orb.talk { animation: pulse 1.1s ease-in-out infinite; }
  .orb.listen { box-shadow: 0 0 0 6px rgba(255,255,255,.08); }
  .orb.off { filter: grayscale(.8) brightness(.7); }
  @keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(232,89,12,.45); } 50% { transform: scale(1.07); box-shadow: 0 0 0 14px rgba(232,89,12,0); } }
  .cam-on .orb { display: none; }
  .cap { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 7px 10px; border-radius: 10px; background: rgba(0,0,0,.55); font-size: 13px; line-height: 1.4; max-height: 58%; overflow: hidden; display: none; }
  .cap.on { display: block; }
  .cap small { display: block; color: var(--soft); font-size: 11.5px; margin-top: 3px; }
  .ask { margin: 4px 10px 0; padding: 8px 10px; border-radius: 10px; background: #fff3e6; color: #7a3204; font-size: 12.5px; font-weight: 600; display: none; align-items: center; gap: 8px; }
  .ask.on { display: flex; }
  .ask button { margin-left: auto; background: var(--orange); color: #fff; padding: 6px 12px; font-size: 12.5px; }
  .msg { margin: 4px 10px 0; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: 12.5px; line-height: 1.45; display: none; }
  .msg.on { display: block; }
  .msg.bad { background: #fdecea; color: #8a1c1c; }
  .bar { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 8px 10px 10px; }
  button { font: 600 13.5px inherit; font-family: inherit; border: 0; border-radius: 22px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:disabled { opacity: .5; cursor: default; }
  .go { background: var(--orange); color: #fff; padding: 10px 18px; font-size: 14px; }
  .round { width: 40px; height: 40px; background: rgba(255,255,255,.14); color: #fff; font-size: 16px; padding: 0; position: relative; }
  .round.off { background: #fff; color: var(--ink); }
  .round.want { animation: want 1s ease-in-out infinite; background: var(--orange); }
  @keyframes want { 0%,100% { box-shadow: 0 0 0 0 rgba(232,89,12,.7); } 50% { box-shadow: 0 0 0 8px rgba(232,89,12,0); } }
  .round small { position: absolute; bottom: -2px; right: -2px; font-size: 9px; background: #5b6b7b; color: #fff; border-radius: 6px; padding: 0 3px; }
  .langs { display: flex; gap: 4px; }
  .langs button { padding: 6px 10px; font-size: 12px; background: rgba(255,255,255,.12); color: #fff; }
  .langs button.on { background: #fff; color: var(--ink); }
  .hidden { display: none !important; }
  body.full .stage { max-width: 720px; width: calc(100% - 20px); margin: 8px auto; aspect-ratio: 4 / 3; flex: none; }
  body.full .bar, body.full .ask, body.full .msg { max-width: 720px; width: calc(100% - 20px); margin-left: auto; margin-right: auto; }
  /* strip=1: Altron as one slim line under the note (26 Oct 2026, founder: the big card was in the way) */
  body.strip { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 0 10px; height: 100vh; overflow: hidden; }
  body.strip .top { flex: none; padding: 0; gap: 6px; }
  body.strip #clock, body.strip .langs, body.strip .orb, body.strip .cap small { display: none !important; }
  body.strip .stage { flex: 1; min-width: 0; height: 44px; margin: 0; background: transparent; border-radius: 8px; justify-content: flex-start; gap: 8px; }
  body.strip .stage:not(.cam-on) video { display: none; }
  body.strip video { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; flex: none; }
  body.strip .cap { position: static; display: block; opacity: 1; background: transparent; padding: 0; margin: 0; max-width: none; flex: 1; min-width: 0;
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; transform: none; }
  body.strip .bar { flex: none; padding: 0; margin: 0; gap: 6px; }
  body.strip .round { width: 38px; height: 38px; font-size: 15px; }
  body.strip .go { padding: 8px 14px; font-size: 13px; }
  body.strip .msg { position: fixed; left: 140px; right: 170px; top: 50%; transform: translateY(-50%); margin: 0; font-size: 12.5px; }
  body.strip .ask { position: fixed; right: 170px; top: 50%; transform: translateY(-50%); margin: 0; }
</style>
</head>
<body>
<div class="top">
  <span class="dot" id="dot"></span>
  <b>Altron</b><span id="status">voice tutor</span>
  <span class="grow"></span>
  <span id="clock"></span>
</div>
<div class="stage" id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <div class="orb off" id="orb"></div>
  <div class="cap" id="cap"><span id="capT"></span><small id="capY"></small></div>
</div>
<div class="ask" id="ask"><span>📷 <span id="askT">Altron wants to see your board</span></span><button type="button" id="askGo">Turn camera on</button></div>
<div class="msg" id="msg"></div>
<div class="bar">
  <div class="langs" id="langs"><button type="button" data-l="en">English</button><button type="button" data-l="hi">Hinglish</button><button type="button" data-l="hd">हिंदी</button></div>
  <button class="go" id="go" type="button">▶ Talk to Altron</button>
  <button class="round hidden" id="mic" type="button" title="Mute the microphone">🎙️</button>
  <button class="round off hidden" id="camBtn" type="button" title="Camera is off. Tap to show Altron your board.">📷<small>off</small></button>
  <button class="round hidden" id="pause" type="button" title="Pause">⏸</button>
</div>
<script>
(() => {
  const API = 'https://edu.altrobytelab.com';
  const P = new URLSearchParams(location.search);
  const FOUNDER = P.get('founder') === '1';                // the founder's own Altron: the CRM and the notes, admin sign-in
  const $ = (id) => document.getElementById(id);
  const course = P.get('course') || null;
  const noteId = P.get('note') ? Number(P.get('note')) : null;
  const labId = P.get('lab') ? Number(P.get('lab')) : null;
  const WORKER = P.get('aud') === 'worker';               // a plant's worker (industrial training): slower, more waiting
  const QUIET_S = WORKER ? 14 : 9, QUIET_MAX = 8;                        // teaching a note: a learner who stays quiet hears the answer
  let quietNudges = 0;
  const IDLE_S = FOUNDER ? 12 : 120;                       // the founder's assistant sleeps 12 s after the talk; its name wakes it
  let replyDue = false;                                    // they spoke and Altron has not answered yet: never sleep then
  let lastWords = Date.now();                              // the last time words were understood, from either side
  let heardAt = 0, nudgedReply = false;                    // when the learner last spoke; whether Altron was reminded
  let lessonDone = false;                                 // the score is saved: the goodbye is the last turn
  let partSince = 0, partWords = 0;                       // when the current part was shown, and Altron's words since
  let saidSent = 0;                                        // when Altron's words were last passed to the note
  let partAt = Math.max(0, Number(P.get('from')) - 1);     // the furthest part taught so far (0: none yet)
  let lang = P.get('lang') || 'en';
  if (P.get('compact') !== '1') document.body.classList.add('full');
  const STRIP = P.get('strip') === '1';
  if (STRIP) document.body.classList.add('strip');
  const host = window.chrome && window.chrome.webview ? window.chrome.webview : null;   // inside the desktop app

  // ── sign-in: the app hands it over in the #fragment, which no server receives ──
  try {
    const t = new URLSearchParams(location.hash.slice(1)).get('t');
    if (t) { sessionStorage.setItem('altron_t', t); history.replaceState(null, '', location.pathname + location.search); }
  } catch (_) {}
  function token() {
    try { const t = sessionStorage.getItem('altron_t'); if (t) return t; } catch (_) {}
    for (const k of FOUNDER ? ['flutter.token'] : ['flutter.student_token', 'flutter.token']) {
      try { const v = localStorage.getItem(k); if (v) { const t = JSON.parse(v); if (t) return t; } } catch (_) {}
    }
    return null;
  }
  function tellHost(o) {
    try { if (host) host.postMessage(JSON.stringify(o)); } catch (_) {}
    try { if (window.AltronHost) window.AltronHost.postMessage(JSON.stringify(o)); } catch (_) {}   // the Altron phone app
    try { if (!host && window.parent !== window) window.parent.postMessage(JSON.stringify(o), location.origin); } catch (_) {}   // the website's note page
  }

  // ── what the learner sees ──
  function say(text, bad) { $('msg').innerHTML = text; $('msg').classList.toggle('bad', !!bad); $('msg').classList.add('on'); }
  function unsay() { $('msg').classList.remove('on'); }
  let lastState = '';
  function status(text, cls) {
    $('status').textContent = text;
    $('dot').className = 'dot' + (cls ? ' ' + cls : '');
    $('orb').className = 'orb' + (cls === 'talk' ? ' talk' : cls === 'live' ? ' listen' : ' off');
    const st = cls || text;
    if (st !== lastState) { lastState = st; tellHost({ type: 'state', state: cls || 'idle', text }); }
  }
  function paintLangs() { for (const b of $('langs').children) b.classList.toggle('on', b.dataset.l === lang); }
  for (const b of $('langs').children) b.onclick = () => { if (!running) { lang = b.dataset.l; paintLangs(); } };
  paintLangs();

  // ── state ──
  let running = false, ws = null, micStream = null, camStream = null, inCtx = null, outCtx = null;
  let micOn = true, camOn = false, frameTimer = null, ticker = null, handle = null, setup = null, wsUrl = '';
  let playing = [], nextAt = 0, tutorLine = '', youLine = '', lastActive = Date.now();
  let conn = null;            // the connection being metered: {ref, seconds, opened, camera, usage}
  let rotateAt = 0;           // when this token's minutes run out and a new one must be asked for
  let firstStart = true;
  let heard = '';             // what the learner said since their last answer: Altron may only answer for them with this

  async function fetchToken(resume) {
    const t = token();
    if (!t) throw Object.assign(new Error('Please sign in to Altrobyte first.'), { signin: true });
    const r = FOUNDER
      ? await fetch(API + '/founder/live/token', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
          body: JSON.stringify({ lang }) })
      : await fetch(API + '/trainer/live/token', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + t },
      body: JSON.stringify({ course_id: course, content_id: noteId, lab_id: labId, steps: P.get('steps') === '1', teach: P.get('teach') === '1', audience: P.get('aud') || '', from_part: Number(P.get('from')) || 0, lang, resume: !!resume }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) throw Object.assign(new Error('Please sign in to Altrobyte first.'), { signin: true });
    if (r.status === 429) throw Object.assign(new Error(body.detail || "Today's talking time is used up. It comes back tomorrow."), { out: true });
    // Altron as a trainer is part of Self-paced; the free tastes never get here
    if (r.status === 402) throw Object.assign(new Error(String(body.detail || '').replace(/^ACCESS_NEEDED:\s*/, '') || 'Altron as your trainer is part of Self-paced.'), { out: true });
    if (!r.ok) throw new Error(body.detail || 'Altron could not start. Try again in a minute.');
    return body;
  }

  // ── metering: what each connection really used, reported to the server ──
  function addUsage(u) {
    if (!conn || !u) return;
    const k = conn.usage;
    k.prompt += u.promptTokenCount || 0; k.response += u.responseTokenCount || 0; k.total += u.totalTokenCount || 0;
    for (const d of u.promptTokensDetails || []) {
      const m = String(d.modality || '').toUpperCase();
      if (m === 'AUDIO') k.prompt_audio += d.tokenCount || 0; else if (m === 'TEXT') k.prompt_text += d.tokenCount || 0; else k.prompt_image += d.tokenCount || 0;
    }
    for (const d of u.responseTokensDetails || []) {
      const m = String(d.modality || '').toUpperCase();
      if (m === 'AUDIO') k.response_audio += d.tokenCount || 0; else k.response_text += d.tokenCount || 0;
    }
  }
  function report(c) {
    if (!c || !c.ref) return;
    const seconds = Math.round(((c.closed || Date.now()) - c.opened) / 1000);
    const camera = Math.round((c.camera + (camOn && !c.closed ? Date.now() - c.camSince : 0)) / 1000);
    try {
      fetch(API + '/trainer/live/usage', { method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
        body: JSON.stringify({ ref: c.ref, seconds, camera_seconds: camera, usage: c.usage }) })
        .then((r) => r.json()).then((b) => { if (b && b.left_minutes != null) $('clock').textContent = b.left_minutes + ' min left today'; }).catch(() => {});
    } catch (_) {}
  }
  function newConn(t) {
    return { ref: t.ref || 0, opened: Date.now(), closed: 0, camera: 0, camSince: Date.now(),
             usage: { prompt: 0, response: 0, total: 0, prompt_text: 0, prompt_audio: 0, prompt_image: 0, response_text: 0, response_audio: 0 } };
  }
  function endConn() {
    if (!conn) return;
    if (camOn) conn.camera += Date.now() - conn.camSince;
    conn.closed = Date.now(); report(conn); conn = null;
  }

  // ── microphone: 16 kHz 16-bit PCM ──
  const MIC = `class Mic extends AudioWorkletProcessor { process(i) { const c = i[0] && i[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } } registerProcessor('mic', Mic);`;
  let pcm = [];
  function b64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  async function startMic() {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    inCtx = new AudioContext({ sampleRate: 16000 });
    await inCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([MIC], { type: 'application/javascript' })));
    const node = new AudioWorkletNode(inCtx, 'mic');
    node.port.onmessage = (e) => {
      if (!micOn || !ready()) return;
      // Someone is speaking: never count it as quiet (the words arrive as text a moment later, which let the founder's
      // assistant fall asleep in the middle of a question).
      let sum = 0;
      for (const v of e.data) { pcm.push(v); sum += v * v; }
      if (e.data.length && Math.sqrt(sum / e.data.length) > 0.06) lastActive = Date.now();   // speech, not a fan or a TV
      if (pcm.length >= 1600) {
        const out = new Int16Array(pcm.length);
        for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); out[i] = s < 0 ? s * 0x8000 : s * 0x7fff; }
        pcm = [];
        ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64(new Uint8Array(out.buffer)), mimeType: 'audio/pcm;rate=16000' } } }));
      }
    };
    inCtx.createMediaStreamSource(micStream).connect(node);
  }
  function stopMic() {
    if (micStream) micStream.getTracks().forEach((t) => t.stop());
    micStream = null; pcm = [];
    if (inCtx) { inCtx.close().catch(() => {}); inCtx = null; }
  }

  // ── Altron's voice: 24 kHz PCM in order; an interruption stops it at once ──
  function play(data) {
    if (!outCtx) outCtx = new AudioContext({ sampleRate: 24000 });
    const raw = atob(data), n = raw.length / 2, f = new Float32Array(n);
    for (let i = 0; i < n; i++) { let v = raw.charCodeAt(2 * i) | (raw.charCodeAt(2 * i + 1) << 8); if (v >= 0x8000) v -= 0x10000; f[i] = v / 0x8000; }
    const buf = outCtx.createBuffer(1, n, 24000); buf.copyToChannel(f, 0);
    const node = outCtx.createBufferSource(); node.buffer = buf; node.connect(outCtx.destination);
    nextAt = Math.max(nextAt, outCtx.currentTime + 0.02); node.start(nextAt); nextAt += buf.duration;
    playing.push(node);
    node.onended = () => { playing = playing.filter((x) => x !== node); lastActive = Date.now(); if (!playing.length && running) status('listening', 'live'); };
    lastActive = Date.now();
    status('talking', 'talk');
  }
  function hush() { for (const n of playing) { try { n.stop(); } catch (_) {} } playing = []; nextAt = 0; }

  // ── the camera: off until the learner turns it on ──
  const canvas = document.createElement('canvas');
  function ready() { return ws && ws.readyState === 1 && ws.__ready; }
  // What the learner did on the note (a hazard tapped, gear chosen, a step pressed): Altron reacts to it. Several taps in a
  // moment go as one line, so Altron is not interrupted on every tap.
  let didQueue = [], didTimer = null;
  let needs = new Set(), doneParts = new Set();         // parts with an activity, and those whose activity is done
  window.altronNeeds = (list) => { needs = new Set((list || []).map(Number)); };
  window.altronDid = (what) => {
    const w = String(what || '');
    if (/^DONE: every activity/.test(w)) doneParts.add(partAt);
    didQueue.push(w.slice(0, 160)); lastActive = Date.now(); quietNudges = 0;
    clearTimeout(didTimer);
    didTimer = setTimeout(() => { const t = didQueue.join('; '); didQueue = []; note('[On the screen the learner just did: ' + t + ']'); }, 1800);
  };
  function note(text) {                                   // tell Altron something that is not the learner speaking
    if (!ready()) return false;
    ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text }] }], turnComplete: true } }));
    lastActive = Date.now();
    return true;
  }
  async function camOnNow() {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } } });
    } catch (e) {
      say('The camera could not start' + (e && e.name === 'NotAllowedError' ? ': it was blocked.' : '. Is another app using it?'), true);
      return;
    }
    $('cam').srcObject = camStream; camOn = true; if (conn) conn.camSince = Date.now();
    $('stage').classList.add('cam-on'); $('ask').classList.remove('on'); $('camBtn').classList.remove('off', 'want');
    $('camBtn').innerHTML = '📷'; $('camBtn').title = 'Camera is on. Tap to turn it off.';
    frameTimer = setInterval(() => {
      if (!camOn || !ready()) return;
      const v = $('cam'); if (!v.videoWidth) return;
      const w = 768, h = Math.round(v.videoHeight * w / v.videoWidth);
      canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(v, 0, 0, w, h);
      ws.send(JSON.stringify({ realtimeInput: { video: { data: canvas.toDataURL('image/jpeg', 0.7).split(',')[1], mimeType: 'image/jpeg' } } }));
    }, 1000);
    note('[The learner turned the camera on. From now you get about one picture a second. Say in a few words what you can see.]');
    tellHost({ type: 'camera', on: true });
  }
  function camOffNow(quiet) {
    if (camOn && conn) conn.camera += Date.now() - conn.camSince;
    camOn = false; clearInterval(frameTimer); frameTimer = null;
    if (camStream) camStream.getTracks().forEach((t) => t.stop());         // the light goes off too
    camStream = null; $('cam').srcObject = null; $('stage').classList.remove('cam-on');
    $('camBtn').classList.add('off'); $('camBtn').innerHTML = '📷<small>off</small>'; $('camBtn').title = 'Camera is off. Tap to show Altron your board.';
    if (!quiet) note('[The learner turned the camera off. You cannot see anything now.]');
    tellHost({ type: 'camera', on: false });
  }
  $('camBtn').onclick = () => { if (!running) return; camOn ? camOffNow() : camOnNow(); };
  $('askGo').onclick = () => { if (running && !camOn) camOnNow(); };

  // ── tools: Altron asks, the page (or the app) answers ──
  const waiting = {};          // tool call id -> resolve, for answers that come from the app
  window.altronToolResult = (id, result) => {
    const done = waiting[id]; if (!done) return false;
    delete waiting[id];
    let r = result; if (typeof r === 'string') { try { r = JSON.parse(r); } catch (_) { r = { text: r }; } }
    done(r || {});
    return true;
  };
  function askApp(call) {
    if (!host) return Promise.resolve({ error: 'The course steps are only available inside the Altrobyte app.' });
    return new Promise((resolve) => {
      waiting[call.id] = resolve;
      tellHost({ type: 'tool', id: call.id, name: call.name, args: call.args || {}, heard: heard.trim().slice(-300) });
      if (call.name === 'answer_for_learner') heard = '';
      setTimeout(() => { if (waiting[call.id]) { delete waiting[call.id]; resolve({ error: 'The app did not answer in time. Ask the learner to tap on the screen.' }); } }, 25000);
    });
  }
  async function onTools(calls) {
    const responses = [];
    for (const call of calls || []) {
      let response;
      if (FOUNDER && call.name === 'place_call') {
        // the phone dials: only the Altron app can (its contacts, its call permission)
        try {
          response = window.AltronHost && window.AltronHost.call
            ? JSON.parse(window.AltronHost.call(String((call.args && call.args.name) || ''), String((call.args && call.args.phone) || '')))
            : { error: 'Calls work only in the Altron phone app.' };
        } catch (_) { response = { error: 'Could not place the call.' }; }
      } else if (FOUNDER) {
        // the founder's tools read the CRM and the notes on the server, with the admin's own sign-in
        try {
          const r = await fetch(API + '/founder/tool', { method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
            body: JSON.stringify({ name: call.name, args: call.args || {} }) });
          response = await r.json();
        } catch (_) { response = { error: 'Could not reach the server.' }; }
      } else if (call.name === 'look_at_screen') {
        // only the desktop app can see the screen: it sends one picture, which goes into the talk as a frame
        if (!host) response = { error: 'Seeing the screen works only in the Altrobyte desktop app.' };
        else {
          const shot = await new Promise((done) => {
            const t = setTimeout(() => done(null), 8000);
            window.altronScreen = (b64) => { clearTimeout(t); done(b64 || null); };
            tellHost({ type: 'screen' });
          });
          if (shot && ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ realtimeInput: { video: { data: shot, mimeType: 'image/jpeg' } } }));
            response = { seen: 'The picture of their screen was just sent to you: describe what matters on it and help.' };
          } else response = { error: 'Could not take a picture of the screen just now.' };
        }
      } else if (call.name === 'save_score') {
        // the end-of-note check: kept with the learner's progress
        const right = Math.max(0, Math.min(3, Number(call.args && call.args.right) || 0));
        try {
          const r = await fetch(API + '/trainer/live/note-score', { method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
            body: JSON.stringify({ content_id: noteId, right }) });
          response = await r.json();
        } catch (_) { response = { kept: false }; }
        tellHost({ type: 'score', right });
        lessonDone = true;
      } else if (call.name === 'show_part') {
        // the note is open in the app: the app scrolls to that section and makes it glow
        // In order, no jumping ahead (29 Oct 2026: it went to the last section, the checklist, mid-lesson). A jump of more
        // than one part is refused and Altron is told which part comes next; the page does not move.
        const want = Number(call.args && call.args.part) || 1;
        // And not on before this part is taught (29 Oct 2026: a note of many small parts ran to its end, part after part,
        // with almost nothing said): the next part opens only after 20 s and about 40 words on this one.
        if (want > partAt + 1) {
          response = { shown: false, error: 'Do not skip ahead. You are on part ' + partAt + '. Teach part ' + (partAt + 1) + ' next: call show_part ' + (partAt + 1) + '.' };
        } else if (WORKER && want > partAt && needs.has(partAt) && !doneParts.has(partAt)) {
          response = { shown: false, error: 'The worker has not finished the activity of part ' + partAt + ' yet. Do it with them now: tell them exactly which one button to press next, one at a time, and wait for each [On the screen ...] line. Move on only after the line saying every activity of this section is finished.' };
        } else if (want > partAt && partSince && (Date.now() - partSince < (WORKER ? 45000 : 20000) || partWords < (WORKER ? 70 : 40))) {
          response = { shown: false, error: 'Part ' + partAt + ' is not taught yet. Explain it properly first: what it is, why it matters, an example from their work, then one short question. Call show_part ' + want + ' after that.' };
        } else {
          if (want > partAt) { partSince = Date.now(); partWords = 0; }
          partAt = Math.max(partAt, want);
          tellHost({ type: 'section', part: want });
          response = { shown: true };
        }
      } else if (call.name === 'ask_camera') {
        if (camOn) response = { camera: 'already on' };
        else {
          $('askT').textContent = (call.args && call.args.reason) ? 'Altron: ' + String(call.args.reason).slice(0, 90) : 'Altron wants to see your board';
          $('ask').classList.add('on'); $('camBtn').classList.add('want');
          response = { camera: 'asked: the camera button is glowing; you will get a message once the learner turns it on' };
        }
      } else {
        response = await askApp(call);
      }
      responses.push({ id: call.id, name: call.name, response });
    }
    lastActive = Date.now();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ toolResponse: { functionResponses: responses } }));
  }

  // ── the conversation ──
  function connect(kind) {          // 'first' | 'continue' (after a pause) | 'renew' (a new token mid-talk)
    const msg = { setup: { ...setup } };
    if (handle) msg.setup.sessionResumption = { handle };
    const me = new WebSocket(wsUrl);
    ws = me;
    me.onopen = () => me.send(JSON.stringify(msg));
    me.onmessage = async (ev) => {
      if (me.__retired || me !== ws) return;            // a connection being replaced never speaks over the new one
      const text = typeof ev.data === 'string' ? ev.data : await ev.data.text();
      let m; try { m = JSON.parse(text); } catch (_) { return; }
      if (m.setupComplete) {
        me.__ready = true;
        status('listening', 'live');
        if (kind === 'first') {
          const camLine = 'My camera is off.';
          const opener = FOUNDER
            ? (P.get('q') ? 'I just said: ' + P.get('q').slice(0, 300) : 'I called you by name. Say "Haan boliye" or similar in two words and listen.')
            : P.get('teach') === '1'
            ? (Number(P.get('from')) > 1
                ? 'The note is open on my screen again. Welcome me back in one line, recap briefly, then call show_part ' + Number(P.get('from')) + ' and carry on from there.'
                : 'The note is open on my screen. Greet me in one short sentence, then call show_part 1 and teach section 1.')
            : (course || P.get('steps') === '1')
            ? 'The session has started. ' + camLine + ' Call get_current_step, then greet me in one short sentence and teach that step.'
            : 'The session has started. ' + camLine + ' Greet me in one short sentence, say what we will look at today and ask what I am working on.';
          note(opener);
        } else if (kind === 'continue') {
          note('[The learner is back after a pause and the camera is off. Welcome them back in a few words and carry on where you were.]');
        }
      }
      if (m.toolCall) onTools(m.toolCall.functionCalls);
      if (m.usageMetadata) addUsage(m.usageMetadata);
      const sc = m.serverContent;
      if (sc) {
        if (sc.interrupted) hush();
        for (const p of (sc.modelTurn && sc.modelTurn.parts) || []) if (p.inlineData && p.inlineData.data) play(p.inlineData.data);
        if (sc.outputTranscription && sc.outputTranscription.text) {
          lastWords = Date.now();
          tutorLine += sc.outputTranscription.text;
          partWords += sc.outputTranscription.text.split(/\s+/).filter(Boolean).length;
          $('capT').textContent = tutorLine.slice(STRIP ? -140 : -260); $('cap').classList.add('on');
          if (Date.now() - saidSent > 1500) { saidSent = Date.now(); tellHost({ type: 'said', text: tutorLine.slice(-220) }); }   // the note follows
        }
        if (sc.inputTranscription && sc.inputTranscription.text) {
          youLine += sc.inputTranscription.text; heard += sc.inputTranscription.text; lastActive = Date.now(); quietNudges = 0; replyDue = true; lastWords = Date.now(); heardAt = Date.now(); nudgedReply = false;
          $('capY').textContent = 'You: ' + youLine.slice(-140); $('cap').classList.add('on');
        }
        if (sc.turnComplete) {
          tutorLine = ''; youLine = ''; replyDue = false; nudgedReply = false; lastActive = Date.now();
          // The lesson is over (founder: it must switch off after completion): once the goodbye has been heard, stop.
          if (lessonDone) {
            const finish = () => { if (playing.length) return setTimeout(finish, 500); pause('Lesson complete. Great work!'); tellHost({ type: 'state', state: 'done' }); };
            setTimeout(finish, 1500);
          }
        }
      }
      if (m.sessionResumptionUpdate && m.sessionResumptionUpdate.resumable && m.sessionResumptionUpdate.newHandle) handle = m.sessionResumptionUpdate.newHandle;
      if (m.goAway) renew();
    };
    me.onclose = (ev) => {
      if (me.__retired || !running) return;
      if (!me.__ready) return stop('Altron could not start: ' + (ev.reason || ('connection closed, ' + ev.code)) + '. Please send this to the team.', true);
      renew();
    };
    me.onerror = () => {};
  }

  // A new token: when Google ends a connection, and before this token's minutes run out. The server says no once the
  // day's minutes are used, and the session then ends kindly.
  let renewing = false;
  async function renew() {
    if (!running || renewing) return;
    renewing = true; status('reconnecting…');
    const old = ws; if (old) { old.__retired = true; try { old.close(); } catch (_) {} }
    hush();                                               // what the old connection was still saying stops now
    endConn();
    try {
      const t = await fetchToken(true);
      wsUrl = t.ws_url + '?access_token=' + encodeURIComponent(t.token); setup = t.setup;
      conn = newConn(t); rotateAt = Date.now() + Math.max(30, (t.seconds || 600) - 10) * 1000;
      connect('renew');
    } catch (e) {
      stop(e.out ? e.message : 'The connection dropped. Tap ▶ to carry on.', !e.out);
    }
    renewing = false;
  }

  async function start() {
    unsay(); $('go').disabled = true; status('connecting…');
    try {
      const t = await fetchToken(!firstStart);
      wsUrl = t.ws_url + '?access_token=' + encodeURIComponent(t.token); setup = t.setup;
      await startMic();
      outCtx = outCtx || new AudioContext({ sampleRate: 24000 });
      if (outCtx.state === 'suspended') { try { await outCtx.resume(); } catch (_) {} }
      running = true; conn = newConn(t);
      rotateAt = Date.now() + Math.max(30, (t.seconds || 600) - 10) * 1000;
      connect(firstStart ? 'first' : 'continue');
      firstStart = false; lastActive = Date.now();
      clearInterval(ticker);
      ticker = setInterval(tick, 1000);
      $('go').classList.add('hidden'); $('langs').classList.add('hidden');
      for (const id of ['mic', 'camBtn', 'pause']) $(id).classList.remove('hidden');
      if (t.left_minutes != null) $('clock').textContent = (t.left_minutes + Math.round((t.seconds || 0) / 60)) + ' min left today';
    } catch (e) {
      cleanup(); $('go').disabled = false; status('voice tutor');
      if (e.name === 'NotAllowedError') say('The microphone was blocked. Allow it, then tap ▶.', true);
      else say(e.message || 'Something went wrong. Try again.', !e.out);
      tellHost({ type: 'state', state: e.out ? 'out_of_minutes' : 'error', text: e.message || '' });
    }
  }

  function tick() {
    if (!running) return;
    if (Date.now() >= rotateAt) return renew();
    const quiet = (Date.now() - lastActive) / 1000;
    // Gemini sometimes goes silent after the learner speaks (26 Oct 2026: "Hello, hello", no answer). After 12 s it is
    // reminded; after 24 s the connection is renewed, carrying on the same talk.
    if (replyDue && heardAt && !playing.length) {
      const waited = (Date.now() - heardAt) / 1000;
      if (waited >= 24) { replyDue = false; nudgedReply = false; heardAt = 0; renew(); return; }
      if (waited >= 12 && !nudgedReply) { nudgedReply = true; note('[The learner spoke and is waiting for you. Answer them now, briefly.]'); return; }
    }
    // Many learners would rather listen than answer. In a note class, a question left unanswered for a few seconds is
    // answered by Altron, who carries on; after several in a row with no word from them, the usual pause takes over.
    if (P.get('teach') === '1' && !playing.length && quiet >= QUIET_S && quietNudges < QUIET_MAX) {
      quietNudges++;
      note('[The learner is listening quietly and did not answer. Do not wait and do not ask whether they are there: give the answer yourself in two or three sentences, then carry on teaching.]');
      return;
    }
    // The founder's assistant: 25 s with no words understood from anyone ends the talk, whatever the room sounds like.
    if (FOUNDER && !playing.length && (Date.now() - lastWords) / 1000 >= 25) {
      pause('Resting. Say "Jarvis" or tap ▶.');
      return;
    }
    if (!playing.length && !replyDue && quiet >= IDLE_S) pause(FOUNDER ? 'Resting. Say "Jarvis" or tap ▶.' : 'Paused because nobody spoke for two minutes. Tap ▶ to carry on.');
  }

  function cleanup() {
    running = false;
    for (const id in waiting) { waiting[id]({ error: 'The session ended.' }); delete waiting[id]; }
    if (ws) { ws.__retired = true; try { ws.close(); } catch (_) {} ws = null; }
    endConn();
    clearInterval(ticker); hush(); stopMic();
    if (camOn || camStream) camOffNow(true);
    $('cap').classList.remove('on'); $('ask').classList.remove('on');
  }
  function stop(message, bad) {
    cleanup();
    for (const id of ['mic', 'camBtn', 'pause']) $(id).classList.add('hidden');
    $('go').classList.remove('hidden'); $('go').disabled = false; $('go').textContent = '▶ Talk to Altron';
    status('voice tutor');
    if (message) say(message, bad);
  }
  function pause(message) {
    stop(message || 'Paused. Tap ▶ to carry on.');
    $('go').textContent = '▶ Continue';
    tellHost({ type: 'state', state: 'paused' });
  }

  // From the app: the course moved on because the learner tapped (one voice: Altron says it), and the app closing.
  window.altronTell = (text) => {
    if (!ready() || !text) return false;
    heard = '';                                         // they answered by tapping: what they said before is used up
    return note('[Screen] ' + String(text).slice(0, 1500));
  };
  window.altronPause = () => { if (running) pause(); };

  $('go').onclick = start;
  $('pause').onclick = () => pause();
  $('mic').onclick = () => { micOn = !micOn; $('mic').classList.toggle('off', !micOn); $('mic').textContent = micOn ? '🎙️' : '🔇'; };
  addEventListener('pagehide', cleanup);
  if (!token()) say('Please sign in to Altrobyte first.', true);
  else if (P.get('autostart') === '1') start();
})();
</script>
</body>
</html>
