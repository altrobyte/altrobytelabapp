<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment · Altrobyte Lab</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://edu.altrobytelab.com" crossorigin>
<!-- A custom-amount payment link the team made in Invoices (31 Oct 2026). altrobytelab.com/pay/<token>: shows who and what
     for, pays through Cashfree, and on payment opens the course for that WhatsApp number and gives the invoice. -->
<style>
  :root { --ink:#0A1220; --panel:#13223A; --line:#22344F; --text:#E8EEF6; --soft:#9DB0C6; --orange:#FF6A1A; --orange2:#FF9A3D; --green:#25D366; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink); color: var(--text); font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
  a { color: inherit; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 28px 16px 48px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; text-decoration: none; margin-bottom: 22px; }
  .logo img { width: 28px; height: 28px; border-radius: 7px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
  .muted { color: var(--soft); font-size: 14.5px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 6px 0 4px; }
  .amt { font-size: 38px; font-weight: 800; margin: 16px 0 2px; letter-spacing: -.02em; }
  .btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; padding: 15px 22px; border-radius: 999px; font-weight: 700; font-size: 16px; border: 0; cursor: pointer; text-decoration: none; margin-top: 18px; }
  .btn-main { background: linear-gradient(135deg, var(--orange), var(--orange2)); color: #fff; }
  .btn-main[disabled] { opacity: .6; cursor: wait; }
  .btn-ghost { border: 1px solid rgba(255,255,255,.22); color: #fff; background: transparent; }
  .ok { color: var(--green); font-size: 44px; line-height: 1; }
  .err { margin-top: 14px; color: #ffb4a2; font-size: 14.5px; }
  .trust { margin-top: 16px; font-size: 13px; color: var(--soft); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/"><img src="/icons/Icon-192.png" alt="">Altrobyte Lab</a>
  <div class="card" id="box"><p class="muted">Loading…</p></div>
  <p class="trust">Secure payment by Cashfree · UPI, cards, net banking</p>
</div>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js" defer></script>
<script>
(function () {
  var API = 'https://edu.altrobytelab.com';
  var token = location.pathname.split('/').filter(Boolean)[1] || '';
  var box = document.getElementById('box');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function rs(n) { return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function call(method, path) {
    return fetch(API + path, { method: method }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.detail && typeof j.detail === 'string' ? j.detail : 'Something went wrong. Please try again.');
        return j;
      });
    });
  }
  function paid(p) {
    box.innerHTML = '<div class="ok">✓</div><h1>Payment received. Thank you' + (p.name ? ', ' + esc(p.name) : '') + '!</h1>' +
      '<p class="muted">' + esc(p.title) + ' · ' + rs(p.amount) + (p.receipt_number ? ' · Receipt ' + esc(p.receipt_number) : '') + '</p>' +
      (p.give_access ? '<p class="muted" style="margin-top:10px">Your course is open. Sign in with your WhatsApp number ending ' + esc(p.phone_end) + '.</p>' +
        '<a class="btn btn-main" href="/learn">Start learning</a>' : '') +
      (p.invoice_url ? '<a class="btn btn-ghost" href="' + esc(p.invoice_url) + '" target="_blank" rel="noopener">Download invoice</a>' : '');
  }
  function show(p) {
    if (p.status === 'paid') return paid(p);
    if (p.status === 'cancelled') {
      box.innerHTML = '<h1>This payment link is no longer active</h1><p class="muted">Please message us on WhatsApp for a new one.</p>';
      return;
    }
    box.innerHTML = '<p class="muted">Hi' + (p.name ? ' ' + esc(p.name) : '') + ', you are paying for</p><h1>' + esc(p.title) + '</h1>' +
      '<div class="amt">' + rs(p.amount) + '</div><p class="muted">GST included · for WhatsApp number ending ' + esc(p.phone_end) + '</p>' +
      '<button class="btn btn-main" id="pay">Pay ' + rs(p.amount) + '</button><div class="err" id="err"></div>';
    document.getElementById('pay').onclick = function () { start(this); };
  }
  function check(quiet) {
    return call('POST', '/pay/' + encodeURIComponent(token) + '/verify').then(function (p) {
      show(p);
      if (p.status !== 'paid' && !quiet) {
        var e = document.getElementById('err');
        if (e) e.textContent = 'We have not received the payment yet. If money left your account, wait a minute and refresh this page.';
      }
      return p;
    });
  }
  function start(btn) {
    var e = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Opening payment…'; e.textContent = '';
    call('POST', '/pay/' + encodeURIComponent(token) + '/checkout').then(function (c) {
      if (c.link_url) { location.href = c.link_url; return; }
      if (!window.Cashfree || !c.payment_session_id) throw new Error('Payment could not start. Please refresh and try again.');
      var cf = new Cashfree({ mode: c.mode === 'production' ? 'production' : 'sandbox' });
      return cf.checkout({ paymentSessionId: c.payment_session_id, redirectTarget: '_modal' }).then(function () {
        box.innerHTML = '<p class="muted">Checking your payment…</p>';
        return check(false);
      });
    }).catch(function (x) {
      btn.disabled = false; btn.textContent = 'Try again';
      e.textContent = x.message;
    });
  }
  if (!token) { box.innerHTML = '<h1>This link is incomplete</h1><p class="muted">Please open the full link we sent you.</p>'; return; }
  var load = /[?&]done=1/.test(location.search) ? check(true) : call('GET', '/pay/' + encodeURIComponent(token)).then(show);
  load.catch(function (x) { box.innerHTML = '<h1>Could not open this payment</h1><p class="muted">' + esc(x.message) + '</p>'; });
})();
</script>
</body>
</html>
